# Example Home Assistant package for one Unlock Sequence automation.
# Copy/adapt the identifiers for EACH separate automation.
# IMPORTANT: No "initial" properties. Helpers must restore values after a restart.
# On FIRST creation, initialize datetime helpers to a past value using
# input_datetime.set_datetime in Developer Tools before enabling the automation.
input_number:
  unlock_sequence_failures:
    name: "Unlock Sequence | Failed attempts"
    icon: mdi:shield-lock
    min: 0
    max: 100
    step: 1
    mode: box

input_datetime:
  unlock_sequence_failure_lock_until:
    name: "Unlock Sequence | Failure lock until"
    has_date: true
    has_time: true

  unlock_sequence_failure_window_started:
    name: "Unlock Sequence | Window began"
    has_date: true
    has_time: true

  unlock_sequence_success_cooldown_until:
    name: "Unlock Sequence | Success cooldown until"
    has_date: true
    has_time: true
