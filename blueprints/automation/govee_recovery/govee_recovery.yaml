blueprint:
  name: "🔧 Govee Light Recovery | Optional ESPHome Relay & MQTT"
  description: >-
    Watch any number of Govee2MQTT lights. Add as many light entries as needed;
    each may optionally include an ESPHome power relay and a Ping sensor.
    First request one Govee2MQTT app restart, then recheck all lights. If a
    lamp remains offline, restore an OFF power relay, and optionally attempt
    a targeted OFF/ON hardware reset as the last resort. Clear, per-lamp
    notifications explain what was observed and what was actually requested.

    Safe defaults: power cycling and bridge restarting are OFF. A persistent
    input_datetime cooldown helper is recommended for persistent throttling,
    and is required for automatic relay power cycling.
    This blueprint does not change a light's desired on/off, colors or effects.
    A lamp that appears available but ignores commands cannot be diagnosed
    from entity availability alone.
  domain: automation
  author: "3115a083"
  source_url: https://github.com/3115a083/ha-blueprints/blob/main/blueprints/automation/govee_recovery/govee_recovery.yaml
  homeassistant:
    min_version: "2025.7.0"
  input:
    devices:
      name: "💡 01 | Lights and optional hardware"
      icon: mdi:ceiling-light-multiple
      description: >-
        Add one entry per Govee lamp. Select the required light; its power relay
        and Ping sensor are optional. There is no fixed device limit.
      input:
        lamp_entries:
          name: "💡 Govee lamps (add as many as needed)"
          description: >-
            Use Add to create a row for each Govee light. Select a power relay
            only if that lamp is actually powered by a controllable switch.
            Ping is optional and only required for deliberate power cycling.
          selector:
            object:
              multiple: true
              label_field: light
              fields:
                light:
                  label: "Govee light"
                  required: true
                  selector:
                    entity:
                      filter:
                        domain: light
                relay:
                  label: "ESPHome or other power relay (optional)"
                  required: false
                  selector:
                    entity:
                      filter:
                        domain: switch
                ping:
                  label: "Ping reachability sensor (optional)"
                  required: false
                  selector:
                    entity:
                      filter:
                        domain: binary_sensor
    recovery:
      name: "🔄 02 | Recovery sequence"
      icon: mdi:wrench-clock
      description: "An enabled Govee2MQTT restart always runs first; relay restoration and optional hard reset follow only if needed."
      input:
        offline_minutes:
          name: "Confirm a light offline for (minutes)"
          description: "Wait through short Govee2MQTT or network interruptions."
          default: 2
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: box
        restore_power:
          name: "Restore a relay found OFF"
          description: "Only applicable to entries with a selected relay. Never cuts power as part of this step."
          default: true
          selector:
            boolean: {}
        relay_wait_seconds:
          name: "Wait after restoring a power relay (seconds)"
          default: 90
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
        power_cycle_enabled:
          name: "⚠️ Allow one targeted power cycle"
          description: >-
            OFF by default. After trying to restart Govee2MQTT, power-cycle
            only still-offline lights with an ON relay. Requires an enabled
            app restart, a valid slug and a persistent cooldown helper.
            Ping is diagnostic unless "Require failed Ping" is enabled.
            Lamps with no relay are never power-cycled.
          default: false
          selector:
            boolean: {}
        max_power_cycles:
          name: "Maximum lamps to hard reset per attempt"
          description: "Safety limit for a single recovery run. Each lamp is power-cycled at most once and rechecked before trying the next."
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: box
        require_ping_off:
          name: "Require failed Ping before hard reset"
          description: "OFF by default. Enable only if your lamps respond reliably to ICMP; then only a configured Ping sensor with state OFF allows a hard reset."
          default: false
          selector:
            boolean: {}
        cycle_off_seconds:
          name: "Duration of power interruption (seconds)"
          default: 3
          selector:
            number:
              min: 3
              max: 15
              step: 1
              unit_of_measurement: s
              mode: box
        cycle_wait_seconds:
          name: "Wait after power cycle (seconds)"
          default: 120
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
    bridge:
      name: "🔄 03 | Govee2MQTT restart (first)"
      icon: mdi:restart
      description: "The first recovery step for an unavailable light. Restart the shared Govee2MQTT app once, then wait before considering a relay hard reset."
      collapsed: true
      input:
        app_restart_enabled:
          name: "Allow restarting the Govee2MQTT app"
          description: "OFF by default. Enable this to restart the Govee2MQTT app first when lights become unavailable. Requires Home Assistant OS/Supervised and a valid app slug. A cooldown helper is strongly recommended."
          default: false
          selector:
            boolean: {}
        app_slug:
          name: "Govee2MQTT app or add-on slug"
          description: "Copy the exact slug from the installed Govee2MQTT app details."
          default: ""
          selector:
            text: {}
        app_wait_seconds:
          name: "Wait after restarting Govee2MQTT (seconds)"
          default: 150
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
    diagnostics:
      name: "🛡️ 04 | Retry protection"
      icon: mdi:shield-check
      description: "Optional persistent cooldown. Without this helper, app restarts can happen on new outage events, but automatic relay power cuts remain blocked."
      collapsed: true
      input:
        cooldown_helper:
          name: "Persistent last recovery time (optional)"
          description: >-
            Select an input_datetime with both DATE and TIME; initialize it
            to a timestamp in the past. Required for relay hard resets and
            periodic retry, recommended for app restart throttling.
          default: ""
          selector:
            entity:
              filter:
                domain: input_datetime
        cooldown_minutes:
          name: "Minimum interval between disruptive attempts (minutes)"
          default: 60
          selector:
            number:
              min: 30
              max: 1440
              step: 10
              unit_of_measurement: min
              mode: box
    notifications:
      name: "🔔 05 | Notifications"
      icon: mdi:bell-alert-outline
      description: "Failed recoveries always create a persistent Home Assistant notification."
      collapsed: true
      input:
        notify_entity:
          name: "Additional notification recipient (optional)"
          description: "Choose a notify entity for an extra phone or other message."
          default: ""
          selector:
            entity:
              filter:
                domain: notify
        notify_on_success:
          name: "Also send notifications after a successful repair"
          default: false
          selector:
            boolean: {}
        notification_language:
          name: "Notification language"
          description: "Language for the clear per-lamp status report."
          default: en
          selector:
            select:
              options:
                - label: "English"
                  value: en
                - label: "Deutsch"
                  value: de

trigger_variables:
  _lamp_entries: !input lamp_entries

variables:
  lamp_entries: !input lamp_entries
  restore_power: !input restore_power
  relay_wait_seconds: !input relay_wait_seconds
  power_cycle_enabled: !input power_cycle_enabled
  max_power_cycles: !input max_power_cycles
  require_ping_off: !input require_ping_off
  cycle_off_seconds: !input cycle_off_seconds
  cycle_wait_seconds: !input cycle_wait_seconds
  app_restart_enabled: !input app_restart_enabled
  app_slug: !input app_slug
  app_wait_seconds: !input app_wait_seconds
  cooldown_helper: !input cooldown_helper
  cooldown_minutes: !input cooldown_minutes
  notify_entity: !input notify_entity
  notify_on_success: !input notify_on_success
  notification_language: !input notification_language


triggers:
  - trigger: template
    id: some_light_offline
    value_template: >-
      {% set ns = namespace(offline=false) %}
      {% for lamp in _lamp_entries %}
        {% if states(lamp.light) in ['unavailable', 'unknown'] %}
          {% set ns.offline = true %}
        {% endif %}
      {% endfor %}
      {{ ns.offline }}
    for:
      minutes: !input offline_minutes
  - trigger: template
    id: some_relay_off
    value_template: >-
      {% set ns = namespace(off=false) %}
      {% for lamp in _lamp_entries %}
        {% set relay = lamp.get('relay', '') | default('', true) %}
        {% if relay != '' and is_state(relay, 'off') %}
          {% set ns.off = true %}
        {% endif %}
      {% endfor %}
      {{ ns.off }}
    for:
      minutes: 1
  - trigger: homeassistant
    id: startup
    event: start
  # Periodic reconciliation catches later failures while another lamp is
  # already unavailable (the aggregate template may stay continuously true).
  - trigger: time_pattern
    id: periodic
    minutes: "/10"

mode: single
max_exceeded: silent

actions:
  - alias: "Allow Home Assistant to finish starting"
    if:
      - condition: template
        value_template: "{{ trigger.id == 'startup' }}"
    then:
      - delay:
          minutes: 3

  - alias: "Check all selected lights and relay power states"
    variables:
      offline_count: >-
        {% set ns = namespace(count=0) %}
        {% for lamp in lamp_entries %}
          {% if states(lamp.light) in ['unavailable', 'unknown'] %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.count }}
      relay_off_count: >-
        {% set ns = namespace(count=0) %}
        {% for lamp in lamp_entries %}
          {% set relay = lamp.get('relay', '') | default('', true) %}
          {% if relay != '' and is_state(relay, 'off') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.count }}
      last_attempt: >-
        {{ as_timestamp(states(cooldown_helper), 0) if cooldown_helper != '' else 0 }}
  - alias: "Report an empty device configuration"
    if:
      - condition: template
        value_template: "{{ lamp_entries | count == 0 }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Govee recovery - configuration needed"
          notification_id: govee_recovery_setup
          message: "Add at least one Govee light to the blueprint before enabling this automation."
      - stop: "No Govee lights selected"

  - alias: "Do nothing while every lamp and relay is healthy"
    condition: template
    value_template: >-
      {{ (offline_count | int > 0) or
         (restore_power and relay_off_count | int > 0) }}
  - alias: "Do not run periodic retries without persistent cooldown"
    condition: template
    value_template: "{{ trigger.id != 'periodic' or cooldown_helper != '' }}"

  - alias: "Check cooldown; never block restoring a relay that is OFF"
    variables:
      cooldown_ready: >-
        {{ cooldown_helper == '' or
           (as_timestamp(now()) - (last_attempt | float(0))) >=
           (cooldown_minutes | int * 60) }}
      persistent_ready: >-
        {{ cooldown_helper != ''
           and (as_timestamp(now()) - (last_attempt | float(0))) >=
           (cooldown_minutes | int * 60) }}
      restart_requested: >-
        {{ offline_count | int > 0 and app_restart_enabled
           and (app_slug | trim != '') and cooldown_ready | bool }}
  - alias: "Explain an active cooldown instead of silently skipping recovery"
    if:
      - condition: template
        value_template: >-
          {{ not cooldown_ready | bool
             and not (restore_power and relay_off_count | int > 0) }}
    then:
      - action: persistent_notification.create
        continue_on_error: true
        data:
          title: "{{ 'Govee: Warte auf nächsten Versuch' if notification_language == 'de' else 'Govee: Waiting before retry' }}"
          notification_id: govee_recovery_failed
          message: >-
            {% if notification_language == 'de' %}
            Mindestens eine Govee-Lampe ist weiterhin nicht erreichbar.
            Die Wiederherstellung wurde wegen der konfigurierten Sperrzeit
            ({{ cooldown_minutes }} Minuten) nicht erneut gestartet.
            Nächster Versuch ab
            {{ (last_attempt | float(0) + cooldown_minutes | int * 60)
               | timestamp_custom('%d.%m.%Y %H:%M', true) }}.
            {% else %}
            At least one Govee lamp is still unavailable.
            Recovery has not been repeated because the {{ cooldown_minutes }}-minute
            cooldown is active. Next allowed attempt:
            {{ (last_attempt | float(0) + cooldown_minutes | int * 60)
               | timestamp_custom('%Y-%m-%d %H:%M', true) }}.
            {% endif %}
      - stop: "Waiting for the next safe retry"

  - alias: "Record the starting condition for the notification"
    variables:
      starting_offline: >-
        {% set ns = namespace(names=[]) %}
        {% for lamp in lamp_entries %}
          {% if states(lamp.light) in ['unavailable', 'unknown'] %}
            {% set ns.names = ns.names + [state_attr(lamp.light, 'friendly_name') or lamp.light] %}
          {% endif %}
        {% endfor %}
        {{ ns.names | join(', ') if ns.names else 'none' }}

  # Persist the cooldown BEFORE any disruptive action. If the helper cannot
  # be updated, abort rather than cutting mains power without a lockout.
  - alias: "Save the persistent retry timestamp"
    if:
      - condition: template
        value_template: "{{ persistent_ready | bool and restart_requested | bool }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ cooldown_helper }}"
        data:
          timestamp: "{{ as_timestamp(now()) | int }}"

  # FIRST: restart the shared bridge for affected lights.
  - alias: "Step 1 - restart Govee2MQTT first"
    if:
      - condition: template
        value_template: "{{ restart_requested | bool }}"
    then:
      - action: hassio.app_restart
        continue_on_error: true
        data:
          app: "{{ app_slug | trim }}"
      - wait_template: >-
          {% set ns = namespace(missing=false) %}
          {% for lamp in lamp_entries %}
            {% if states(lamp.light) in ['unavailable', 'unknown'] %}
              {% set ns.missing = true %}
            {% endif %}
          {% endfor %}
          {{ not ns.missing }}
        timeout:
          seconds: !input app_wait_seconds
        continue_on_timeout: true

  # SECOND: if a power relay is actually OFF, restore it to ON (no power cut).
  - alias: "Step 2 - restore OFF relays that still need power"
    if:
      - condition: template
        value_template: "{{ restore_power and relay_off_count | int > 0 }}"
    then:
      - repeat:
          for_each: !input lamp_entries
          sequence:
            - variables:
                current_relay: "{{ repeat.item.get('relay', '') | default('', true) }}"
            - if:
                - condition: template
                  value_template: "{{ current_relay != '' and is_state(current_relay, 'off') }}"
              then:
                - action: switch.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ current_relay }}"
      - wait_template: >-
          {% set ns = namespace(missing=false) %}
          {% for lamp in lamp_entries %}
            {% if states(lamp.light) in ['unavailable', 'unknown'] %}
              {% set ns.missing = true %}
            {% endif %}
          {% endfor %}
          {{ not ns.missing }}
        timeout:
          seconds: !input relay_wait_seconds
        continue_on_timeout: true

  # THIRD: select only STILL unavailable lamps with their own ON relays.
  # No Ping sensor is required by default: Ping is not a reliable proxy for
  # Govee LAN/MQTT. A separate opt-in can enforce failed Ping.
  - alias: "Find still-offline lamps eligible for a hard reset"
    variables:
      hard_reset_allowed: >-
        {{ power_cycle_enabled and restart_requested | bool
           and persistent_ready | bool
           and relay_off_count | int == 0 }}
  - variables:
      reset_candidates: >-
        {% set ns = namespace(items=[]) %}
        {% if hard_reset_allowed | bool %}
          {% for lamp in lamp_entries %}
            {% set relay = lamp.get('relay', '') | default('', true) %}
            {% set ping = lamp.get('ping', '') | default('', true) %}
            {% if states(lamp.light) in ['unavailable', 'unknown']
                  and relay != '' and is_state(relay, 'on')
                  and (not require_ping_off or (ping != '' and is_state(ping, 'off'))) %}
              {% set ns.items = ns.items + [lamp] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.items[:max_power_cycles | int] }}
  - alias: "Summarize the planned hard resets and skipped reasons"
    variables:
      reset_candidate_names: >-
        {% set ns = namespace(names=[]) %}
        {% for lamp in reset_candidates %}
          {% set ns.names = ns.names + [state_attr(lamp.light, 'friendly_name') or lamp.light] %}
        {% endfor %}
        {{ ns.names | join(', ') if ns.names else 'none' }}
      hard_reset_skip_reason: >-
        {% if not power_cycle_enabled %}
          disabled
        {% elif not restart_requested | bool %}
          add-on restart not configured or cooldown active
        {% elif not persistent_ready | bool %}
          date-and-time cooldown helper required
        {% elif relay_off_count | int > 0 %}
          a power relay was OFF; restore ON instead
        {% else %}
          no eligible offline light with an ON relay or lights recovered
        {% endif %}

  - alias: "Step 3 - hard-reset remaining lamps one at a time"
    repeat:
      for_each: "{{ reset_candidates }}"
      sequence:
        - variables:
            current_light: "{{ repeat.item.light }}"
            current_relay: "{{ repeat.item.get('relay', '') | default('', true) }}"
        - if:
            - condition: template
              value_template: >-
                {{ states(current_light) in ['unavailable', 'unknown']
                   and current_relay != '' and is_state(current_relay, 'on') }}
          then:
            - action: switch.turn_off
              continue_on_error: true
              target:
                entity_id: "{{ current_relay }}"
            - delay:
                seconds: !input cycle_off_seconds
            # Always attempt to switch power ON again even when OFF fails.
            - action: switch.turn_on
              continue_on_error: true
              target:
                entity_id: "{{ current_relay }}"
            - wait_template: "{{ states(current_light) not in ['unavailable', 'unknown'] }}"
              timeout:
                seconds: !input cycle_wait_seconds
              continue_on_timeout: true

  - alias: "Collect readable final results"
    variables:
      final_offline_count: >-
        {% set ns = namespace(n=0) %}
        {% for lamp in lamp_entries %}
          {% if states(lamp.light) in ['unavailable', 'unknown'] %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n }}
      final_relay_problem: >-
        {% set ns = namespace(bad=false) %}
        {% for lamp in lamp_entries %}
          {% set relay = lamp.get('relay', '') | default('', true) %}
          {% if relay != '' and not is_state(relay, 'on') %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}
  - alias: "Build human-readable notification"
    variables:
      recovery_message: |-
        {% if notification_language == 'de' %}
        **Govee-Verbindungsprüfung**

        **Auslöser:** {{ 'Keine Verbindung: ' ~ starting_offline if offline_count | int > 0 else 'Ein Relais war ausgeschaltet' }}

        **Status der Lampen:**
        {% for lamp in lamp_entries %}
        {% set relay = lamp.get('relay', '') | default('', true) %}
        {% set ping = lamp.get('ping', '') | default('', true) %}
        - **{{ state_attr(lamp.light, 'friendly_name') or lamp.light }}**: {{ 'Keine Verbindung' if states(lamp.light) in ['unavailable', 'unknown'] else 'Erreichbar' }}{% if relay != '' %}; Relais {{ 'AN' if is_state(relay, 'on') else ('AUS' if is_state(relay, 'off') else 'nicht erreichbar') }}{% endif %}{% if ping != '' %}; Ping {{ 'OK' if is_state(ping, 'on') else ('ohne Antwort' if is_state(ping, 'off') else 'unbekannt') }}{% endif %}

        {% endfor %}
        **Wiederherstellungsversuche:**
        - Govee2MQTT: {{ 'Neustart angefordert' if restart_requested | bool else ('deaktiviert' if not app_restart_enabled else ('Add-on-Kennung fehlt' if app_slug | trim == '' else 'Sperrzeit noch aktiv')) }}
        - Stromversorgung: {{ 'Relais einschalten angefordert' if restore_power and relay_off_count | int > 0 else 'kein ausgeschaltetes Relais erkannt' }}
        - Hard-Reset: {{ ('für ' ~ reset_candidate_names ~ ' vorgesehen') if reset_candidates | count > 0 else ('ausgelassen: ' ~ hard_reset_skip_reason | trim) }}

        **Ergebnis:** {{ 'Mindestens eine Lampe ist weiterhin nicht erreichbar. Bitte Govee2MQTT-Protokoll und WLAN prüfen.' if final_offline_count | int > 0 else ('Bitte Stromversorgung/Relais prüfen.' if final_relay_problem | bool else 'Alle Lampen wieder erreichbar.') }}
        {% else %}
        **Govee connection check**

        **Reason:** {{ 'Offline: ' ~ starting_offline if offline_count | int > 0 else 'A power relay was OFF' }}

        **Lamp status:**
        {% for lamp in lamp_entries %}
        {% set relay = lamp.get('relay', '') | default('', true) %}
        {% set ping = lamp.get('ping', '') | default('', true) %}
        - **{{ state_attr(lamp.light, 'friendly_name') or lamp.light }}**: {{ 'Offline' if states(lamp.light) in ['unavailable', 'unknown'] else 'Available' }}{% if relay != '' %}; relay {{ 'ON' if is_state(relay, 'on') else ('OFF' if is_state(relay, 'off') else 'unavailable') }}{% endif %}{% if ping != '' %}; Ping {{ 'OK' if is_state(ping, 'on') else ('no reply' if is_state(ping, 'off') else 'unknown') }}{% endif %}

        {% endfor %}
        **Recovery attempts:**
        - Govee2MQTT: {{ 'Restart requested' if restart_requested | bool else ('disabled' if not app_restart_enabled else ('add-on slug missing' if app_slug | trim == '' else 'cooldown still active')) }}
        - Relay: {{ 'Restore power requested' if restore_power and relay_off_count | int > 0 else 'No OFF relay found' }}
        - Hard reset: {{ ('planned for ' ~ reset_candidate_names) if reset_candidates | count > 0 else ('skipped: ' ~ hard_reset_skip_reason | trim) }}

        **Result:** {{ 'At least one lamp is still offline. Check the Govee2MQTT logs and Wi-Fi.' if final_offline_count | int > 0 else ('Check relay power and wiring.' if final_relay_problem | bool else 'All lamps are available again.') }}
        {% endif %}

  - alias: "Notify on remaining faults; clear old warnings after recovery"
    choose:
      - alias: "Recovery failed"
        conditions:
          - condition: template
            value_template: "{{ final_offline_count | int > 0 or final_relay_problem | bool }}"
        sequence:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              title: "{{ 'Govee: Verbindung weiterhin gestört' if notification_language == 'de' else 'Govee: Lights still offline' }}"
              notification_id: govee_recovery_failed
              message: "{{ recovery_message }}"
          - if:
              - condition: template
                value_template: "{{ notify_entity != '' }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entity }}"
                data:
                  title: "{{ 'Govee: Verbindung weiterhin gestört' if notification_language == 'de' else 'Govee: Lights still offline' }}"
                  message: "{{ recovery_message }}"
      - alias: "Recovery succeeded"
        conditions:
          - condition: template
            value_template: "{{ final_offline_count | int == 0 and not final_relay_problem | bool }}"
        sequence:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: govee_recovery_failed
          - if:
              - condition: template
                value_template: "{{ notify_on_success and notify_entity != '' }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entity }}"
                data:
                  title: "{{ 'Govee: Wieder verbunden' if notification_language == 'de' else 'Govee: Connected again' }}"
                  message: "{{ recovery_message }}"
