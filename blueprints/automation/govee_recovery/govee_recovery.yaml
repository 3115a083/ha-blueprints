blueprint:
  name: "🔧 Govee Light Recovery | Optional ESPHome Relay & MQTT"
  description: >-
    Watch any number of Govee2MQTT lights. Add as many light entries as needed;
    each may optionally include an ESPHome power relay and a Ping sensor.
    Restore a relay that unexpectedly turns OFF, optionally try a carefully
    guarded single-device power cycle, and optionally restart Govee2MQTT once
    per recovery attempt. Report unrecovered lights through Home Assistant.

    Safe defaults: power cycling and bridge restarting are OFF. A persistent
    input_datetime cooldown helper is required before disruptive recovery.
    This blueprint does not change a light's desired on/off, colors or effects.
    A lamp that appears available but ignores commands cannot be diagnosed
    from entity availability alone.
  domain: automation
  author: "3115a083"
  source_url: https://github.com/3115a083/ha-blueprints/blob/main/blueprints/automation/govee_recovery/govee_recovery.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: "💡 01 | Lights and optional hardware"
      icon: mdi:ceiling-light-multiple
      description: >-
        Add one entry per Govee lamp. Select the required light; its power relay
        and Ping sensor are optional. There is no fixed device limit.
      input:
        lamp_entries:
          name: "💡 Govee lamps (add as many as needed)"
          description: >-
            Use Add to create a row for each Govee light. Select a power relay
            only if that lamp is actually powered by a controllable switch.
            Ping is optional and only required for deliberate power cycling.
          selector:
            object:
              multiple: true
              label_field: light
              description_field: relay
              fields:
                light:
                  label: "Govee light"
                  required: true
                  selector:
                    entity:
                      filter:
                        domain: light
                relay:
                  label: "ESPHome or other power relay (optional)"
                  required: false
                  selector:
                    entity:
                      filter:
                        domain: switch
                ping:
                  label: "Ping reachability sensor (optional)"
                  required: false
                  selector:
                    entity:
                      filter:
                        domain: binary_sensor
    recovery:
      name: "🛠️ 02 | Recovery steps"
      icon: mdi:wrench-clock
      description: "Restore a relay found OFF; enable more disruptive steps only after testing."
      input:
        offline_minutes:
          name: "Confirm a light offline for (minutes)"
          description: "Wait through short Govee2MQTT or network interruptions."
          default: 2
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: box
        restore_power:
          name: "Restore a relay found OFF"
          description: "Only applicable to entries with a selected relay. Never cuts power as part of this step."
          default: true
          selector:
            boolean: {}
        relay_wait_seconds:
          name: "Wait after restoring a power relay (seconds)"
          default: 90
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
        power_cycle_enabled:
          name: "⚠️ Allow one targeted power cycle"
          description: >-
            OFF by default. Only when exactly one light was offline at the
            start, its relay is ON, its Ping sensor is OFF, no relay needed
            restoration in this run, and the persistent cooldown was saved.
            Lamps with no selected relay can NEVER be power-cycled.
          default: false
          selector:
            boolean: {}
        cycle_off_seconds:
          name: "Duration of power interruption (seconds)"
          default: 5
          selector:
            number:
              min: 3
              max: 15
              step: 1
              unit_of_measurement: s
              mode: box
        cycle_wait_seconds:
          name: "Wait after power cycle (seconds)"
          default: 120
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
    bridge:
      name: "🔄 03 | Optional Govee2MQTT restart"
      icon: mdi:restart
      description: "Last resort for lights still unavailable after device checks. At most one restart for the entire lamp list."
      collapsed: true
      input:
        app_restart_enabled:
          name: "Allow restarting the Govee2MQTT app"
          description: "OFF by default. Requires Home Assistant OS or Supervised and a persistent cooldown helper."
          default: false
          selector:
            boolean: {}
        app_slug:
          name: "Govee2MQTT app or add-on slug"
          description: "Copy the exact slug from the installed Govee2MQTT app details."
          default: ""
          selector:
            text: {}
        app_wait_seconds:
          name: "Wait after restarting Govee2MQTT (seconds)"
          default: 150
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
    diagnostics:
      name: "📡 04 | Retry protection"
      icon: mdi:shield-check
      description: "One global cooldown controls disruptive actions across all selected lights."
      collapsed: true
      input:
        cooldown_helper:
          name: "Persistent last recovery time (optional)"
          description: >-
            Select an input_datetime with both DATE and TIME; initialize
            it to an older timestamp. Required for deliberate power cycling,
            Govee2MQTT restarts and periodic retries.
          default: ""
          selector:
            entity:
              filter:
                domain: input_datetime
        cooldown_minutes:
          name: "Minimum interval between disruptive attempts (minutes)"
          default: 60
          selector:
            number:
              min: 30
              max: 1440
              step: 10
              unit_of_measurement: min
              mode: box
    notifications:
      name: "🔔 05 | Notifications"
      icon: mdi:bell-alert-outline
      description: "Failed recoveries always create a persistent Home Assistant notification."
      collapsed: true
      input:
        notify_entity:
          name: "Additional notification recipient (optional)"
          description: "Choose a notify entity for an extra phone or other message."
          default: ""
          selector:
            entity:
              filter:
                domain: notify
        notify_on_success:
          name: "Also send notifications after a successful repair"
          default: false
          selector:
            boolean: {}

trigger_variables:
  _lamp_entries: !input lamp_entries

variables:
  lamp_entries: !input lamp_entries
  restore_power: !input restore_power
  relay_wait_seconds: !input relay_wait_seconds
  power_cycle_enabled: !input power_cycle_enabled
  cycle_off_seconds: !input cycle_off_seconds
  cycle_wait_seconds: !input cycle_wait_seconds
  app_restart_enabled: !input app_restart_enabled
  app_slug: !input app_slug
  app_wait_seconds: !input app_wait_seconds
  cooldown_helper: !input cooldown_helper
  cooldown_minutes: !input cooldown_minutes
  notify_entity: !input notify_entity
  notify_on_success: !input notify_on_success

triggers:
  # The template observes all selected light entities, independent of count.
  - trigger: template
    id: some_light_offline
    value_template: >-
      {% set ns = namespace(offline=false) %}
      {% for lamp in _lamp_entries %}
        {% if states(lamp.light) in ['unavailable', 'unknown'] %}
          {% set ns.offline = true %}
        {% endif %}
      {% endfor %}
      {{ ns.offline }}
    for:
      minutes: !input offline_minutes
  - trigger: template
    id: some_relay_off
    value_template: >-
      {% set ns = namespace(off=false) %}
      {% for lamp in _lamp_entries %}
        {% set relay = lamp.get('relay', '') %}
        {% if relay != '' and is_state(relay, 'off') %}
          {% set ns.off = true %}
        {% endif %}
      {% endfor %}
      {{ ns.off }}
    for:
      minutes: 1
  - trigger: homeassistant
    id: startup
    event: start
  - trigger: time_pattern
    id: periodic
    minutes: "/30"

mode: single
max_exceeded: silent

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'startup' }}"
    then:
      - delay:
          minutes: 3

  # Count the original outages and power faults before changing anything.
  - variables:
      initial_offline_count: >-
        {% set ns = namespace(n=0) %}
        {% for lamp in lamp_entries %}
          {% if states(lamp.light) in ['unavailable', 'unknown'] %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n }}
      initial_relay_fault: >-
        {% set ns = namespace(fault=false) %}
        {% for lamp in lamp_entries %}
          {% set relay = lamp.get('relay', '') %}
          {% if relay != '' and is_state(relay, 'off') %}
            {% set ns.fault = true %}
          {% endif %}
        {% endfor %}
        {{ ns.fault }}
      last_attempt: >-
        {{ as_timestamp(states(cooldown_helper), 0) if cooldown_helper != '' else 0 }}
  - if:
      - condition: template
        value_template: "{{ lamp_entries | count == 0 }}"
    then:
      - action: persistent_notification.create
        continue_on_error: true
        data:
          title: "Govee recovery setup incomplete"
          notification_id: govee_recovery_setup
          message: "Select at least one Govee light in the lamp list."
      - stop: "No Govee lights selected."

  - variables:
      cooldown_ok: >-
        {{ cooldown_helper != '' and (
             as_timestamp(now()) - (last_attempt | float(0))) >=
             (cooldown_minutes | int * 60) }}
  # Do not execute a periodic run without persistence, and do not act if healthy.
  - condition: template
    value_template: "{{ trigger.id != 'periodic' or cooldown_helper != '' }}"
  - condition: template
    value_template: >-
      {{ initial_offline_count | int > 0
         or (restore_power and initial_relay_fault | bool) }}
  # A definite OFF relay can always be restored even during the cooldown.
  - condition: template
    value_template: >-
      {{ cooldown_ok | bool or
         (restore_power and initial_relay_fault | bool) or
         cooldown_helper == '' }}

  - variables:
      initial_snapshot: >-
        {% set ns = namespace(rows=[]) %}
        {% for lamp in lamp_entries %}
          {% set relay = lamp.get('relay', '') %}
          {% set ping = lamp.get('ping', '') %}
          {% set line = lamp.light ~ '=' ~ states(lamp.light)
             ~ ', power=' ~ (states(relay) if relay != '' else 'no relay')
             ~ ', ping=' ~ (states(ping) if ping != '' else 'not configured') %}
          {% set ns.rows = ns.rows + [line] %}
        {% endfor %}
        {{ ns.rows | join('; ') }}

  # Lock out recurring disruptive operations across restarts.
  - if:
      - condition: template
        value_template: "{{ cooldown_ok | bool }}"
    then:
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ cooldown_helper }}"
        data:
          timestamp: "{{ as_timestamp(now()) | int }}"
  - variables:
      cooldown_saved: >-
        {{ cooldown_ok | bool and cooldown_helper != ''
           and as_timestamp(states(cooldown_helper), 0) > 0
           and as_timestamp(states(cooldown_helper), 0) >=
               as_timestamp(now()) - 120 }}

  # Step 1: all configured relays found OFF are turned ON, never OFF.
  - if:
      - condition: template
        value_template: "{{ restore_power and initial_relay_fault | bool }}"
    then:
      - repeat:
          for_each: !input lamp_entries
          sequence:
            - variables:
                current_relay: "{{ repeat.item.get('relay', '') }}"
            - if:
                - condition: template
                  value_template: "{{ current_relay != '' and is_state(current_relay, 'off') }}"
              then:
                - action: switch.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ current_relay }}"
      - wait_template: >-
          {% set ns = namespace(offline=false) %}
          {% for lamp in lamp_entries %}
            {% if states(lamp.light) in ['unavailable', 'unknown'] %}
              {% set ns.offline = true %}
            {% endif %}
          {% endfor %}
          {{ not ns.offline }}
        timeout:
          seconds: !input relay_wait_seconds
        continue_on_timeout: true

  # Step 2: only one offline lamp can be power-cycled per attempt;
  # this is never attempted for an entry that has no relay or Ping sensor.
  - if:
      - condition: template
        value_template: >-
          {{ power_cycle_enabled and cooldown_saved | bool
             and initial_offline_count | int == 1
             and not initial_relay_fault | bool }}
    then:
      - repeat:
          for_each: !input lamp_entries
          sequence:
            - variables:
                current_light: "{{ repeat.item.light }}"
                current_relay: "{{ repeat.item.get('relay', '') }}"
                current_ping: "{{ repeat.item.get('ping', '') }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ states(current_light) in ['unavailable', 'unknown']
                       and current_relay != '' and is_state(current_relay, 'on')
                       and current_ping != '' and is_state(current_ping, 'off') }}
              then:
                - action: switch.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ current_relay }}"
                - delay:
                    seconds: !input cycle_off_seconds
                - action: switch.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ current_relay }}"
                - wait_template: "{{ states(current_light) not in ['unavailable', 'unknown'] }}"
                  timeout:
                    seconds: !input cycle_wait_seconds
                  continue_on_timeout: true

  # Step 3: one Govee2MQTT app restart, not one restart per lamp.
  # Can run with no relays at all; skip lamps with a definitely OFF relay.
  - if:
      - condition: template
        value_template: >-
          {% set ns = namespace(missing=false) %}
          {% for lamp in lamp_entries %}
            {% set relay = lamp.get('relay', '') %}
            {% if states(lamp.light) in ['unavailable', 'unknown']
                  and (relay == '' or is_state(relay, 'on')) %}
              {% set ns.missing = true %}
            {% endif %}
          {% endfor %}
          {{ app_restart_enabled and cooldown_saved | bool
             and app_slug | trim != '' and ns.missing }}
    then:
      - action: hassio.app_restart
        continue_on_error: true
        data:
          app: "{{ app_slug | trim }}"
      - wait_template: >-
          {% set ns = namespace(offline=false) %}
          {% for lamp in lamp_entries %}
            {% if states(lamp.light) in ['unavailable', 'unknown'] %}
              {% set ns.offline = true %}
            {% endif %}
          {% endfor %}
          {{ not ns.offline }}
        timeout:
          seconds: !input app_wait_seconds
        continue_on_timeout: true

  # Report all remaining failures in one notification.
  - variables:
      final_missing: >-
        {% set ns = namespace(missing=false) %}
        {% for lamp in lamp_entries %}
          {% if states(lamp.light) in ['unavailable', 'unknown'] %}
            {% set ns.missing = true %}
          {% endif %}
        {% endfor %}
        {{ ns.missing }}
      final_bad_relay: >-
        {% set ns = namespace(bad=false) %}
        {% for lamp in lamp_entries %}
          {% set relay = lamp.get('relay', '') %}
          {% if relay != '' and not is_state(relay, 'on') %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}
      final_snapshot: >-
        {% set ns = namespace(rows=[]) %}
        {% for lamp in lamp_entries %}
          {% set relay = lamp.get('relay', '') %}
          {% set ping = lamp.get('ping', '') %}
          {% set line = lamp.light ~ '=' ~ states(lamp.light)
             ~ ', power=' ~ (states(relay) if relay != '' else 'no relay')
             ~ ', ping=' ~ (states(ping) if ping != '' else 'not configured') %}
          {% set ns.rows = ns.rows + [line] %}
        {% endfor %}
        {{ ns.rows | join('; ') }}
  - variables:
      recovery_message: >-
        Govee recovery report for {{ lamp_entries | count }} lamp(s).
        Before: {{ initial_snapshot | trim }}.
        After: {{ final_snapshot | trim }}.
        Relay restoration={{ restore_power }};
        power cycling={{ power_cycle_enabled and cooldown_saved | bool }};
        Govee2MQTT restart={{ app_restart_enabled and cooldown_saved | bool }}.
        Inspect Govee2MQTT/MQTT logs, Wi-Fi, LAN API and power hardware
        if an entity remains unavailable.
  - choose:
      - alias: "🔔 Recovery failed"
        conditions:
          - condition: template
            value_template: "{{ final_missing | bool or final_bad_relay | bool }}"
        sequence:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              title: "⚠️ Govee light recovery failed"
              notification_id: govee_recovery_failed
              message: "{{ recovery_message }}"
          - if:
              - condition: template
                value_template: "{{ notify_entity != '' }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entity }}"
                data:
                  title: "Govee light recovery failed"
                  message: "{{ recovery_message }}"
      - alias: "✅ All selected lights available"
        conditions:
          - condition: template
            value_template: "{{ not final_missing | bool and not final_bad_relay | bool }}"
        sequence:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: govee_recovery_failed
          - if:
              - condition: template
                value_template: "{{ notify_on_success and notify_entity != '' }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entity }}"
                data:
                  title: "Govee light recovery succeeded"
                  message: "{{ recovery_message }}"
