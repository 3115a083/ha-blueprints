blueprint:
  name: "🔧 Govee Light Recovery | ESPHome Relay & MQTT"
  description: >-
    Recover up to two Govee lights controlled by Govee2MQTT and powered through
    ESPHome relays. Investigate unavailable light entities, restore OFF relays,
    optionally power-cycle a single unreachable light, and optionally restart
    the Govee2MQTT Home Assistant app once. Report failures in Home Assistant
    and optionally through a notify entity.

    Safe defaults: power cycling and app restarting are OFF. No light on/off,
    brightness or color commands are sent. An input_datetime cooldown helper
    is required to enable automated power cycling and recurring recovery.
    ICMP reachability is only a diagnostic hint, not a definitive LAN-API test.
  domain: automation
  author: "3115a083"
  source_url: https://github.com/3115a083/ha-blueprints/blob/main/blueprints/automation/govee_recovery/govee_recovery.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: "💡 01 | Lights and ESPHome relays"
      icon: mdi:ceiling-light
      description: "Configure the first light/relay pair and optionally a second. Each relay is normally kept powered ON."
      input:
        light_1:
          name: "Govee light 1"
          selector:
            entity:
              filter:
                domain: light
        relay_1:
          name: "ESPHome power relay 1"
          description: "A switch that supplies mains power to light 1. Normally ON."
          selector:
            entity:
              filter:
                domain: switch
        light_2:
          name: "Govee light 2 (optional)"
          default: ""
          selector:
            entity:
              filter:
                domain: light
        relay_2:
          name: "ESPHome power relay 2 (required when light 2 is selected)"
          default: ""
          selector:
            entity:
              filter:
                domain: switch
    recovery:
      name: "🛠️ 02 | Recovery steps"
      icon: mdi:wrench-clock
      description: "Safe relay restoration runs first. A deliberate power cycle must be enabled explicitly."
      input:
        offline_minutes:
          name: "Confirm an offline light after (minutes)"
          description: "Avoid repairing very short MQTT/Wi-Fi outages. Govee2MQTT may itself take minutes to mark a device unavailable."
          default: 2
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: box
        restore_power:
          name: "Restore a relay found OFF"
          description: "If a configured relay is OFF, turn it ON. Never sends OFF as part of this step."
          default: true
          selector:
            boolean: {}
        relay_wait_seconds:
          name: "Wait after restoring power (seconds)"
          default: 90
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
        power_cycle_enabled:
          name: "⚠️ Allow one deliberate relay power cycle"
          description: >-
            Disabled by default. Requires a dedicated ping sensor reporting OFF,
            a relay reporting ON, only ONE failed light, and a configured
            cooldown helper. Cuts mains power briefly; never enable for
            safety-critical lighting or during ESPHome firmware updates.
          default: false
          selector:
            boolean: {}
        cycle_off_seconds:
          name: "Duration of deliberate power cut (seconds)"
          default: 5
          selector:
            number:
              min: 3
              max: 15
              step: 1
              unit_of_measurement: s
              mode: box
        cycle_wait_seconds:
          name: "Wait after a power cycle (seconds)"
          default: 120
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
    bridge:
      name: "🔄 03 | Optional Govee2MQTT restart"
      icon: mdi:restart
      description: "A last resort for lights still unavailable after relay checks. Restarts the shared bridge at most once per recovery run."
      collapsed: true
      input:
        app_restart_enabled:
          name: "Allow restarting the Govee2MQTT app"
          description: "Off by default. Requires Home Assistant OS or Supervised with the Supervisor restart action."
          default: false
          selector:
            boolean: {}
        app_slug:
          name: "Govee2MQTT app / add-on slug"
          description: "Copy the exact slug from Settings > Apps > Govee2MQTT, not its display name. Example slug depends on the installed repository."
          default: ""
          selector:
            text: {}
        app_wait_seconds:
          name: "Wait after app restart (seconds)"
          default: 150
          selector:
            number:
              min: 30
              max: 300
              step: 10
              unit_of_measurement: s
              mode: box
    diagnostics:
      name: "📡 04 | Reachability and retry limits"
      icon: mdi:wifi-alert
      description: "Optional ICMP sensors help distinguish device connectivity from MQTT bridge problems."
      collapsed: true
      input:
        ping_1:
          name: "Light 1 reachable via Ping (optional)"
          description: "Binary sensor ON=reachable, OFF=unreachable. Some devices ignore ICMP, so an OFF result alone is not proof that the device is dead."
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
        ping_2:
          name: "Light 2 reachable via Ping (optional)"
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
        cooldown_helper:
          name: "Persistent last recovery time (optional but recommended)"
          description: >-
            An input_datetime with both date and time, shared by these two lights.
            Required to permit power cycling or periodic retry. Prevents repeated
            interventions across Home Assistant restarts. Initialize it in the past.
          default: ""
          selector:
            entity:
              filter:
                domain: input_datetime
        cooldown_minutes:
          name: "Minimum time between attempts (minutes)"
          default: 60
          selector:
            number:
              min: 30
              max: 1440
              step: 10
              unit_of_measurement: min
              mode: box
    notify:
      name: "🔔 05 | Notifications"
      icon: mdi:bell-alert-outline
      description: "Always creates a Home Assistant persistent notification when recovery fails."
      collapsed: true
      input:
        notify_entity:
          name: "Additional notification recipient (optional)"
          description: "Choose a notify entity for a phone or another destination. Home Assistant's persistent notification remains active even when this is empty."
          default: ""
          selector:
            entity:
              filter:
                domain: notify
        notify_on_success:
          name: "Also notify after a successful repair"
          default: false
          selector:
            boolean: {}

trigger_variables:
  _light_1: !input light_1
  _light_2: !input light_2
  _relay_1: !input relay_1
  _relay_2: !input relay_2

variables:
  light_1: !input light_1
  relay_1: !input relay_1
  light_2: !input light_2
  relay_2: !input relay_2
  ping_1: !input ping_1
  ping_2: !input ping_2
  restore_power: !input restore_power
  relay_wait_seconds: !input relay_wait_seconds
  power_cycle_enabled: !input power_cycle_enabled
  cycle_off_seconds: !input cycle_off_seconds
  cycle_wait_seconds: !input cycle_wait_seconds
  app_restart_enabled: !input app_restart_enabled
  app_slug: !input app_slug
  app_wait_seconds: !input app_wait_seconds
  cooldown_helper: !input cooldown_helper
  cooldown_minutes: !input cooldown_minutes
  notify_entity: !input notify_entity
  notify_on_success: !input notify_on_success

triggers:
  - trigger: template
    id: lamp_1_unavailable
    value_template: "{{ states(_light_1) in ['unavailable', 'unknown'] }}"
    for:
      minutes: !input offline_minutes
  - trigger: template
    id: lamp_2_unavailable
    value_template: "{{ _light_2 != '' and states(_light_2) in ['unavailable', 'unknown'] }}"
    for:
      minutes: !input offline_minutes
  - trigger: template
    id: relay_1_off
    value_template: "{{ is_state(_relay_1, 'off') }}"
    for:
      minutes: 1
  - trigger: template
    id: relay_2_off
    value_template: "{{ _relay_2 != '' and is_state(_relay_2, 'off') }}"
    for:
      minutes: 1
  - trigger: homeassistant
    id: startup
    event: start
  - trigger: time_pattern
    id: periodic
    minutes: "/30"

mode: single
max_exceeded: silent

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'startup' }}"
    then:
      - delay:
          minutes: 3

  - variables:
      pair_2_valid: "{{ (light_2 == '' and relay_2 == '') or (light_2 != '' and relay_2 != '') }}"
      lamp_1_missing: "{{ states(light_1) in ['unavailable', 'unknown'] }}"
      lamp_2_missing: "{{ light_2 != '' and states(light_2) in ['unavailable', 'unknown'] }}"
      last_attempt: >-
        {{ as_timestamp(states(cooldown_helper), 0) if cooldown_helper != '' else 0 }}
  - condition: template
    value_template: "{{ pair_2_valid | bool }}"
  # Avoid periodic executions when no persisted cooldown is configured.
  - condition: template
    value_template: "{{ trigger.id != 'periodic' or cooldown_helper != '' }}"
  - condition: template
    value_template: >-
      {{ lamp_1_missing | bool or lamp_2_missing | bool
         or (restore_power and (
              is_state(relay_1, 'off')
              or (relay_2 != '' and is_state(relay_2, 'off')))) }}
  - condition: template
    value_template: >-
      {{ cooldown_helper == ''
         or (as_timestamp(now()) - (last_attempt | float(0))) >=
            (cooldown_minutes | int * 60) }}

  - variables:
      both_missing_initially: "{{ lamp_1_missing | bool and lamp_2_missing | bool }}"
      initial_snapshot: >-
        Light 1={{ states(light_1) }}, relay 1={{ states(relay_1) }},
        ping 1={{ states(ping_1) if ping_1 != '' else 'not configured' }};
        light 2={{ states(light_2) if light_2 != '' else 'not configured' }},
        relay 2={{ states(relay_2) if relay_2 != '' else 'not configured' }},
        ping 2={{ states(ping_2) if ping_2 != '' else 'not configured' }}
  - if:
      - condition: template
        value_template: "{{ cooldown_helper != '' }}"
    then:
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ cooldown_helper }}"
        data:
          timestamp: "{{ as_timestamp(now()) | int }}"

  # Step 1: restore loss of power. Do not turn the relay OFF here.
  - if:
      - condition: template
        value_template: "{{ restore_power and is_state(relay_1, 'off') }}"
    then:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ relay_1 }}"
  - if:
      - condition: template
        value_template: "{{ restore_power and relay_2 != '' and is_state(relay_2, 'off') }}"
    then:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ relay_2 }}"
  - if:
      - condition: template
        value_template: >-
          {{ restore_power and (
             'off' in [states(relay_1), states(relay_2) if relay_2 != '' else 'on']
             or trigger.id in ['relay_1_off', 'relay_2_off']) }}
    then:
      - wait_template: >-
          {{ states(light_1) not in ['unavailable', 'unknown']
             and (light_2 == '' or states(light_2) not in ['unavailable', 'unknown']) }}
        timeout:
          seconds: !input relay_wait_seconds
        continue_on_timeout: true

  # Step 2: an opt-in power cycle, only for a *single* unavailable light
  # whose dedicated ping sensor reports OFF. Never cycle both at once.
  - if:
      - condition: template
        value_template: >-
          {{ power_cycle_enabled and cooldown_helper != ''
             and not (both_missing_initially | bool)
             and states(light_1) in ['unavailable', 'unknown']
             and is_state(relay_1, 'on')
             and ping_1 != '' and is_state(ping_1, 'off') }}
    then:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ relay_1 }}"
      - delay:
          seconds: !input cycle_off_seconds
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ relay_1 }}"
      - wait_template: "{{ states(light_1) not in ['unavailable', 'unknown'] }}"
        timeout:
          seconds: !input cycle_wait_seconds
        continue_on_timeout: true
  - if:
      - condition: template
        value_template: >-
          {{ power_cycle_enabled and cooldown_helper != ''
             and not (both_missing_initially | bool)
             and light_2 != '' and states(light_2) in ['unavailable', 'unknown']
             and is_state(relay_2, 'on')
             and ping_2 != '' and is_state(ping_2, 'off') }}
    then:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ relay_2 }}"
      - delay:
          seconds: !input cycle_off_seconds
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ relay_2 }}"
      - wait_template: "{{ states(light_2) not in ['unavailable', 'unknown'] }}"
        timeout:
          seconds: !input cycle_wait_seconds
        continue_on_timeout: true

  # Step 3: one bridge restart shared across both lamps. Never restart HA or
  # the MQTT broker. No bridge restart if all light entities are available.
  - if:
      - condition: template
        value_template: >-
          {{ app_restart_enabled and app_slug | trim != ''
             and (
               (states(light_1) in ['unavailable', 'unknown'] and is_state(relay_1, 'on'))
               or (light_2 != '' and states(light_2) in ['unavailable', 'unknown']
                   and is_state(relay_2, 'on'))
             ) }}
    then:
      - action: hassio.app_restart
        continue_on_error: true
        data:
          app: "{{ app_slug | trim }}"
      - wait_template: >-
          {{ states(light_1) not in ['unavailable', 'unknown']
             and (light_2 == '' or states(light_2) not in ['unavailable', 'unknown']) }}
        timeout:
          seconds: !input app_wait_seconds
        continue_on_timeout: true

  # Re-check live conditions. "off" is a valid light state; "unavailable" is not.
  - variables:
      final_missing: >-
        {{ (states(light_1) in ['unavailable', 'unknown'])
           or (light_2 != '' and states(light_2) in ['unavailable', 'unknown']) }}
      final_bad_relay: >-
        {{ not is_state(relay_1, 'on')
           or (relay_2 != '' and not is_state(relay_2, 'on')) }}
      final_snapshot: >-
        Light 1={{ states(light_1) }}, relay 1={{ states(relay_1) }},
        ping 1={{ states(ping_1) if ping_1 != '' else 'not configured' }};
        light 2={{ states(light_2) if light_2 != '' else 'not configured' }},
        relay 2={{ states(relay_2) if relay_2 != '' else 'not configured' }},
        ping 2={{ states(ping_2) if ping_2 != '' else 'not configured' }}
  - variables:
      recovery_message: >-
        Govee recovery finished. Before: {{ initial_snapshot | trim }}.
        After: {{ final_snapshot | trim }}.
        Steps allowed: restore relay={{ restore_power }},
        power cycle={{ power_cycle_enabled and cooldown_helper != '' }},
        app restart={{ app_restart_enabled and app_slug | trim != '' }}.
        Check Govee2MQTT logs, LAN API setting, Wi-Fi, MQTT and the Sonoff
        relay if any light remains unavailable.
  - choose:
      - alias: "🔔 Notify about failed recovery"
        conditions:
          - condition: template
            value_template: "{{ final_missing | bool or final_bad_relay | bool }}"
        sequence:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              title: "⚠️ Govee light recovery failed"
              notification_id: govee_recovery_failed
              message: "{{ recovery_message }}"
          - if:
              - condition: template
                value_template: "{{ notify_entity != '' }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entity }}"
                data:
                  title: "Govee light recovery failed"
                  message: "{{ recovery_message }}"
      - alias: "✅ Recovery succeeded"
        conditions:
          - condition: template
            value_template: "{{ not final_missing | bool and not final_bad_relay | bool }}"
        sequence:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: govee_recovery_failed
          - if:
              - condition: template
                value_template: "{{ notify_on_success and notify_entity != '' }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entity }}"
                data:
                  title: "Govee light recovery succeeded"
                  message: "{{ recovery_message }}"
