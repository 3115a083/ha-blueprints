blueprint:
  name: "Area Occupancy Manager | Presence & Vacancy"
  description: >-
    Derive area occupancy automatically from persons, device trackers, and optional
    presence signals. An input_boolean can publish the computed result for dashboards
    and other automations, but is not required for tracker-only operation.
    Combine motion/presence sensors, door sequences, custom triggers and safety guards.
    Configure any Home Assistant actions
    for vacancy, arrival, and multiple independent timed operations.
    Supports guest mode, sleep mode, diagnostics, and restart-resilient timers per timed action.

    IMPORTANT: Motion sensors alone cannot reliably detect sleeping or still
    people. Configure reliable sensors or explicit guest/sleep protection.
    Alarms, locks, and garage doors need independent safety checks.
    Legacy in-memory delays do not survive Home Assistant restarts.

    Set custom trigger IDs to custom_away or custom_home.
  domain: automation
  author: "3115a083"
  homeassistant:
    min_version: "2024.10.0"
  input:
    base:
      name: "01 | Occupancy source and published state"
      icon: mdi:home-account
      input:
        occupancy_helper:
          name: "Published occupancy switch (optional)"
          description: >-
            Optional input_boolean OUTPUT. The automation sets it automatically: ON = occupied,
            OFF = vacant. Other automations can read this switch. Do not manually set it for
            normal arrivals/departures. If left empty, selected person/device trackers directly
            trigger arrival/vacancy actions; for multi-sensor occupancy, guest-aware status,
            door/custom trigger workflows, or persistent shared status, select a switch.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
    automatic_evidence:
      name: "02 | Automatic detection"
      icon: mdi:account-search
      input:
        tracked_entities:
          name: "People / device trackers (required without a switch)"
          description: >-
            Select one or more person or device_tracker entities. They are the primary presence
            sources: a person at home means occupied; ALL selected trackers away long enough
            means potentially vacant. Other zones count as away. Unknown and unavailable states
            block vacancy. Without a published occupancy switch, only these tracker transitions
            can directly run arrival/vacancy actions.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: device_tracker
        tracked_away_minutes:
          name: "Minimum away time (minutes)"
          default: 3
          selector:
            number:
              min: 0
              max: 120
              step: 1
              unit_of_measurement: min
              mode: box
        activity_sensors:
          name: "Motion / presence sensors (optional)"
          description: >-
            All selected sensors must be OFF and stable before vacancy. Any ON sensor immediately restores
            occupancy. PIR motion alone cannot detect sleeping people.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
        inactive_minutes:
          name: "Minimum inactivity (minutes)"
          description: >-
            Use a generous period for PIR detectors. Reliable mmWave presence sensors may use shorter
            periods.
          default: 20
          selector:
            number:
              min: 0
              max: 240
              step: 1
              unit_of_measurement: min
              mode: box
        evidence_policy:
          name: "How should vacancy evidence be combined?"
          description: >-
            ALL (recommended) requires every configured tracker and activity sensor to confirm absence. ANY
            accepts one qualifying signal, completed exit sequence, or custom vacancy trigger. Known
            occupants, active/unavailable sensors, and enabled guest/sleep modes always block automatic
            vacancy.
          default: all
          selector:
            select:
              options:
                - label: "ALL configured methods (safer)"
                  value: all
                - label: "ANY one qualifying method (faster)"
                  value: any
    safeguards:
      name: "03 | False-vacancy protection"
      icon: mdi:shield-check
      input:
        guest_mode:
          name: "Guest mode / vacancy blocker (optional)"
          description: >-
            ON means guests are present: restore occupancy and block automatic vacancy. Unknown or
            unavailable status also blocks vacancy. Manual occupancy changes remain possible.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        sleep_mode:
          name: "Sleep mode (optional)"
          description: >-
            ON explicitly indicates occupancy and prevents vacancy even without activity. Turning it ON
            restores occupancy. Unknown or unavailable status blocks vacancy.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        blocking_sensors:
          name: "Additional presence protection sensors (optional)"
          description: >-
            Every sensor must be OFF for automatic vacancy. ON restores occupancy. Unknown and unavailable
            also block vacancy. Use reliable bed or mmWave presence sensors.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
        away_conditions:
          name: "Additional conditions for automatic vacancy"
          description: >-
            All custom Home Assistant conditions must pass before marking the area vacant. Use for extra
            sensors or authorization checks.
          default: []
          selector:
            condition: {}
        home_conditions:
          name: "Additional conditions for automatic occupancy"
          description: >-
            These apply to automatic arrival, but not manual changes or explicit guest/sleep presence. For
            night-only lights, put sun/lux conditions in the arrival actions instead.
          default: []
          selector:
            condition: {}
    diagnostics:
      name: "04 | Diagnostics"
      icon: mdi:clipboard-text-search
      collapsed: true
      input:
        diagnostics_enabled:
          name: "Enable diagnostics"
          description: >-
            Expose reasons in automation traces and optionally in a text helper.
          default: false
          selector:
            boolean: {}
        diagnostics_text:
          name: "Diagnostics text helper (optional)"
          description: >-
            Select an input_text helper to show occupancy and reasons on a dashboard. Up to 255 characters
            can be stored.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        diagnostics_log:
          name: "Log blocked vacancy attempts"
          description: >-
            Write system-log entries for relevant vacancy events. This does not log every minute.
          default: false
          selector:
            boolean: {}
    entrances:
      name: "05 | Doors and custom triggers"
      icon: mdi:door
      collapsed: true
      input:
        exit_first_door:
          name: "Door sequence: door 1 (optional)"
          description: >-
            Door 1 ON then door 2 ON indicates exit; the reverse order indicates entry.
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
        exit_second_door:
          name: "Door sequence: door 2 (optional)"
          description: >-
            Configure together with door 1. The second contact must open after the first.
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
        door_route_seconds:
          name: "Maximum time between door contacts (seconds)"
          default: 30
          selector:
            number:
              min: 1
              max: 300
              step: 1
              unit_of_measurement: s
              mode: box
        arrival_lock:
          name: "Unlocked door means arrival (optional)"
          description: >-
            Unlocking a selected lock can restore occupancy. Apply extra arrival conditions for remote
            unlocks.
          default: ""
          selector:
            entity:
              filter:
                domain: lock
        extra_away_triggers:
          name: "Custom vacancy triggers (optional)"
          description: >-
            Use any Home Assistant trigger, and set its ID to custom_away. Vacancy protection still applies.
          default: []
          selector:
            trigger: {}
        extra_home_triggers:
          name: "Custom arrival triggers (optional)"
          description: >-
            Use any Home Assistant trigger, and set its ID to custom_home.
          default: []
          selector:
            trigger: {}
    actions_section:
      name: "06 | Actions"
      icon: mdi:lightning-bolt
      input:
        away_actions:
          name: "Actions when the area becomes vacant"
          description: >-
            Choose any Home Assistant actions: alarm, lights, media, locks, or scripts. Runs once on ON to
            OFF.
          default: []
          selector:
            action: {}
        home_actions:
          name: "Actions when the area becomes occupied"
          description: >-
            Choose any Home Assistant actions. Runs once on OFF to ON. For night-only lighting add a sun or
            lux condition here.
          default: []
          selector:
            action: {}
    temporary:
      name: "07 | Timed arrival action 1 (existing)"
      icon: mdi:timer-outline
      collapsed: true
      input:
        temporary_enabled:
          name: "Enable timed action 1"
          default: false
          selector:
            boolean: {}
        temporary_start_conditions:
          name: "Only start when ..."
          description: >-
            All conditions must pass. Example: a phone is connected to its owner's car by Bluetooth.
          default: []
          selector:
            condition: {}
        temporary_start_actions:
          name: "Actions immediately on arrival"
          description: >-
            Example: open the garage door after suitable safety checks.
          default: []
          selector:
            action: {}
        temporary_minutes:
          name: "Delay before follow-up (minutes)"
          default: 40
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        temporary_deadline:
          name: "Restart-resilient: deadline helper (optional)"
          description: >-
            Select an input_datetime with BOTH date and time. Configure together with the pending helper.
          default: ""
          selector:
            entity:
              filter:
                domain: input_datetime
        temporary_pending:
          name: "Restart-resilient: pending helper (optional)"
          description: >-
            Select a dedicated input_boolean, initially OFF. Configure together with the deadline helper. It
            is cleared before running the follow-up.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        temporary_end_conditions:
          name: "Safety checks before follow-up"
          description: >-
            For garage doors, verify obstacle protection and door state. Failed checks skip the follow-up;
            they do not trigger retries.
          default: []
          selector:
            condition: {}
        temporary_end_actions:
          name: "Actions after the delay"
          description: >-
            Example: close a garage door. With both timer helpers, the deadline is recovered after restarts
            and checked roughly once per minute.
          default: []
          selector:
            action: {}

    temporary_2:
      name: "08 | Timed arrival action 2"
      icon: mdi:timer-outline
      collapsed: true
      input:
        temporary_2_enabled:
          name: "Enable timed action 2"
          description: "Run this independent action when the area becomes occupied."
          default: false
          selector:
            boolean: {}
        temporary_2_start_conditions:
          name: "Start conditions for action 2"
          description: "All conditions must pass. Example: phone is connected to the car, or a door is locked."
          default: []
          selector:
            condition: {}
        temporary_2_start_actions:
          name: "Actions to run immediately (2)"
          description: "Any Home Assistant actions, such as garage open or unlock door."
          default: []
          selector:
            action: {}
        temporary_2_minutes:
          name: "Follow-up delay for action 2 (minutes)"
          default: 30
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        temporary_2_deadline:
          name: "Restart-safe deadline for action 2 (optional)"
          description: "Select a dedicated input_datetime with both date and time; requires the matching pending helper."
          default: ""
          selector:
            entity:
              filter:
                domain: input_datetime
        temporary_2_pending:
          name: "Restart-safe pending flag for action 2 (optional)"
          description: "Select a dedicated input_boolean, initially OFF. Never share helpers between timed actions."
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        temporary_2_end_conditions:
          name: "Safety conditions before follow-up (2)"
          description: "All conditions must pass before follow-up; failed checks skip the action."
          default: []
          selector:
            condition: {}
        temporary_2_end_actions:
          name: "Actions after the delay (2)"
          description: "Example: lock the door after 30 minutes; or close the garage after 40 minutes."
          default: []
          selector:
            action: {}
    temporary_3:
      name: "09 | Timed arrival action 3"
      icon: mdi:timer-outline
      collapsed: true
      input:
        temporary_3_enabled:
          name: "Enable timed action 3"
          description: "Run this independent action when the area becomes occupied."
          default: false
          selector:
            boolean: {}
        temporary_3_start_conditions:
          name: "Start conditions for action 3"
          description: "All conditions must pass. Example: phone is connected to the car, or a door is locked."
          default: []
          selector:
            condition: {}
        temporary_3_start_actions:
          name: "Actions to run immediately (3)"
          description: "Any Home Assistant actions, such as garage open or unlock door."
          default: []
          selector:
            action: {}
        temporary_3_minutes:
          name: "Follow-up delay for action 3 (minutes)"
          default: 15
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        temporary_3_deadline:
          name: "Restart-safe deadline for action 3 (optional)"
          description: "Select a dedicated input_datetime with both date and time; requires the matching pending helper."
          default: ""
          selector:
            entity:
              filter:
                domain: input_datetime
        temporary_3_pending:
          name: "Restart-safe pending flag for action 3 (optional)"
          description: "Select a dedicated input_boolean, initially OFF. Never share helpers between timed actions."
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        temporary_3_end_conditions:
          name: "Safety conditions before follow-up (3)"
          description: "All conditions must pass before follow-up; failed checks skip the action."
          default: []
          selector:
            condition: {}
        temporary_3_end_actions:
          name: "Actions after the delay (3)"
          description: "Example: lock the door after 30 minutes; or close the garage after 40 minutes."
          default: []
          selector:
            action: {}

trigger_variables:
  _trackers: !input tracked_entities
  _activity: !input activity_sensors
  _lock: !input arrival_lock
  _first_door: !input exit_first_door
  _second_door: !input exit_second_door
  _sleep: !input sleep_mode
  _guest: !input guest_mode
  _blockers: !input blocking_sensors
  _occupancy_helper: !input occupancy_helper

variables:
  occupancy_helper: !input occupancy_helper
  tracked_entities: !input tracked_entities
  activity_sensors: !input activity_sensors
  blocking_sensors: !input blocking_sensors
  guest_mode: !input guest_mode
  sleep_mode: !input sleep_mode
  diagnostics_enabled: !input diagnostics_enabled
  diagnostics_text: !input diagnostics_text
  diagnostics_log: !input diagnostics_log
  tracked_away_minutes: !input tracked_away_minutes
  inactive_minutes: !input inactive_minutes
  evidence_policy: !input evidence_policy
  arrival_lock: !input arrival_lock
  exit_first_door: !input exit_first_door
  exit_second_door: !input exit_second_door
  temporary_enabled: !input temporary_enabled
  temporary_minutes: !input temporary_minutes
  temporary_deadline: !input temporary_deadline
  temporary_pending: !input temporary_pending
  temporary_2_enabled: !input temporary_2_enabled
  temporary_2_minutes: !input temporary_2_minutes
  temporary_2_deadline: !input temporary_2_deadline
  temporary_2_pending: !input temporary_2_pending
  temporary_3_enabled: !input temporary_3_enabled
  temporary_3_minutes: !input temporary_3_minutes
  temporary_3_deadline: !input temporary_3_deadline
  temporary_3_pending: !input temporary_3_pending
  temporary_helpers_unique: >-
    {% set ids = [temporary_deadline, temporary_pending, temporary_2_deadline,
                  temporary_2_pending, temporary_3_deadline, temporary_3_pending]
                | reject('eq', '') | list %}
    {{ ids | unique | list | count == ids | count }}

# Custom trigger IDs: custom_away or custom_home.
triggers:
  - triggers: !input extra_away_triggers
  - triggers: !input extra_home_triggers
  - trigger: template
    id: tracker_away
    value_template: >-
      {% set ns = namespace(valid=(_trackers | count > 0)) %}
      {% for entity in _trackers %}
        {% if states(entity) in ['home', 'unknown', 'unavailable'] %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {{ ns.valid }}
    for:
      minutes: !input tracked_away_minutes
  - trigger: template
    id: tracker_home
    value_template: >-
      {{ _trackers | count > 0
         and (expand(_trackers) | selectattr('state', 'eq', 'home') | list | count) > 0 }}
  - trigger: template
    id: activity_away
    value_template: >-
      {% set ns = namespace(valid=(_activity | count > 0)) %}
      {% for entity in _activity %}
        {% if not is_state(entity, 'off') %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {{ ns.valid }}
    for:
      minutes: !input inactive_minutes
  - trigger: template
    id: activity_home
    value_template: >-
      {{ _activity | count > 0
         and (expand(_activity) | selectattr('state', 'eq', 'on') | list | count) > 0 }}
  - trigger: template
    id: guest_home
    value_template: "{{ _guest != '' and is_state(_guest, 'on') }}"
  - trigger: template
    id: blocker_home
    value_template: >-
      {{ _blockers | count > 0
         and (expand(_blockers) | selectattr('state', 'eq', 'on') | list | count) > 0 }}
  - trigger: template
    id: sleep_home
    value_template: "{{ _sleep != '' and is_state(_sleep, 'on') }}"
  - trigger: template
    id: lock_home
    value_template: "{{ _lock != '' and is_state(_lock, 'unlocked') }}"
  - trigger: template
    id: exit_first
    value_template: "{{ _first_door != '' and _second_door != '' and is_state(_first_door, 'on') }}"
  - trigger: template
    id: entry_first
    value_template: "{{ _first_door != '' and _second_door != '' and is_state(_second_door, 'on') }}"
  # Template triggers keep the optional helper valid when left empty.
  - trigger: template
    id: became_away
    value_template: "{{ _occupancy_helper != '' and is_state(_occupancy_helper, 'off') }}"
  - trigger: template
    id: became_home
    value_template: "{{ _occupancy_helper != '' and is_state(_occupancy_helper, 'on') }}"
  - trigger: homeassistant
    id: reconcile
    event: start
  - trigger: time_pattern
    id: reconcile
    minutes: "/5"
  - trigger: time_pattern
    id: temporary_tick
    minutes: "*"

# Parallel runs keep legacy delayed actions from blocking status transitions.
mode: parallel
max: 20
max_exceeded: warning

# Recheck current sensors at action time.
actions:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'exit_first' }}"
    then:
      - wait_for_trigger:
          - trigger: template
            value_template: "{{ exit_second_door != '' and is_state(exit_second_door, 'on') }}"
        timeout:
          seconds: !input door_route_seconds
        continue_on_timeout: false
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'entry_first' }}"
    then:
      - wait_for_trigger:
          - trigger: template
            value_template: "{{ exit_first_door != '' and is_state(exit_first_door, 'on') }}"
        timeout:
          seconds: !input door_route_seconds
        continue_on_timeout: false

  - variables:
      all_trackers_away_stable: >-
        {% set ns = namespace(valid=(tracked_entities | count > 0)) %}
        {% for entity in tracked_entities %}
          {% set item = states[entity] %}
          {% if item is none or item.state in ['home', 'unknown', 'unavailable']
                or (as_timestamp(now()) - as_timestamp(item.last_changed, 0)) < (tracked_away_minutes | int * 60) %}
            {% set ns.valid = false %}
          {% endif %}
        {% endfor %}
        {{ ns.valid }}
      all_activity_quiet_stable: >-
        {% set ns = namespace(valid=(activity_sensors | count > 0)) %}
        {% for entity in activity_sensors %}
          {% set item = states[entity] %}
          {% if item is none or item.state != 'off'
                or (as_timestamp(now()) - as_timestamp(item.last_changed, 0)) < (inactive_minutes | int * 60) %}
            {% set ns.valid = false %}
          {% endif %}
        {% endfor %}
        {{ ns.valid }}
      known_trackers_safe: >-
        {% set ns = namespace(safe=true) %}
        {% for entity in tracked_entities %}
          {% if states(entity) in ['home', 'unknown', 'unavailable'] %}
            {% set ns.safe = false %}
          {% endif %}
        {% endfor %}
        {{ ns.safe }}
      activity_clear: >-
        {% set ns = namespace(clear=true) %}
        {% for entity in activity_sensors %}
          {% if not is_state(entity, 'off') %}
            {% set ns.clear = false %}
          {% endif %}
        {% endfor %}
        {{ ns.clear }}
      blockers_clear: >-
        {% set ns = namespace(clear=true) %}
        {% for entity in blocking_sensors %}
          {% if not is_state(entity, 'off') %}
            {% set ns.clear = false %}
          {% endif %}
        {% endfor %}
        {{ ns.clear }}
      sleep_clear: "{{ sleep_mode == '' or is_state(sleep_mode, 'off') }}"
      anyone_home_now: >-
        {{ (sleep_mode != '' and is_state(sleep_mode, 'on'))
            or (guest_mode != '' and is_state(guest_mode, 'on'))
            or (blocking_sensors | count > 0
              and (expand(blocking_sensors) | selectattr('state', 'eq', 'on') | list | count) > 0)
            or (tracked_entities | count > 0
             and (expand(tracked_entities) | selectattr('state', 'eq', 'home') | list | count) > 0)
           or (activity_sensors | count > 0
             and (expand(activity_sensors) | selectattr('state', 'eq', 'on') | list | count) > 0) }}
  - variables:
      absence_evidence_ok: >-
        {% set has_tracker = tracked_entities | count > 0 %}
        {% set has_activity = activity_sensors | count > 0 %}
        {% if evidence_policy == 'all' %}
          {{ (not has_tracker or all_trackers_away_stable | bool)
             and (not has_activity or all_activity_quiet_stable | bool) }}
        {% else %}
          {{ all_trackers_away_stable | bool or all_activity_quiet_stable | bool
             or trigger.id in ['exit_first', 'custom_away'] }}
        {% endif %}

  - variables:
      derived_vacant: >-
        {{ (occupancy_helper != '' and is_state(occupancy_helper, 'off'))
           or (occupancy_helper == '' and tracked_entities | count > 0
               and all_trackers_away_stable | bool
               and known_trackers_safe | bool
               and activity_clear | bool
               and blockers_clear | bool
               and sleep_clear | bool
               and (guest_mode == '' or is_state(guest_mode, 'off'))
               and absence_evidence_ok | bool) }}
      diagnostic_line: >-
        {% set ns = namespace(reasons=[]) %}
        {% if guest_mode != '' and not is_state(guest_mode, 'off') %}
          {% set ns.reasons = ns.reasons + ['Guest mode=' ~ states(guest_mode)] %}
        {% endif %}
        {% if sleep_mode != '' and not is_state(sleep_mode, 'off') %}
          {% set ns.reasons = ns.reasons + ['Sleep mode=' ~ states(sleep_mode)] %}
        {% endif %}
        {% for entity in blocking_sensors %}
          {% if not is_state(entity, 'off') %}
            {% set ns.reasons = ns.reasons + [entity ~ '=' ~ states(entity)] %}
          {% endif %}
        {% endfor %}
        {% for entity in tracked_entities %}
          {% if states(entity) in ['home', 'unknown', 'unavailable'] %}
            {% set ns.reasons = ns.reasons + [entity ~ '=' ~ states(entity)] %}
          {% endif %}
        {% endfor %}
        {% for entity in activity_sensors %}
          {% if not is_state(entity, 'off') %}
            {% set ns.reasons = ns.reasons + [entity ~ '=' ~ states(entity)] %}
          {% endif %}
        {% endfor %}
        {% if tracked_entities | count > 0 and not all_trackers_away_stable | bool and known_trackers_safe | bool %}
          {% set ns.reasons = ns.reasons + ['Tracker away delay not met'] %}
        {% endif %}
        {% if activity_sensors | count > 0 and not all_activity_quiet_stable | bool and activity_clear | bool %}
          {% set ns.reasons = ns.reasons + ['Inactivity delay not met'] %}
        {% endif %}
        {% if not absence_evidence_ok | bool and ns.reasons | count == 0 %}
          {% set ns.reasons = ns.reasons + ['No valid vacancy evidence'] %}
        {% endif %}
        {% if derived_vacant | bool %}
          {{ 'VACANT | ' ~ (ns.reasons | join('; ') if ns.reasons else 'No active blockers') }}
        {% elif ns.reasons %}
          {{ 'OCCUPIED | Vacancy blocked: ' ~ (ns.reasons | join('; ')) }}
        {% else %}
          {{ 'OCCUPIED | Awaiting trigger / extra conditions' }}
        {% endif %}
  - variables:
      diagnostic_value: >-
        {{ diagnostic_line | trim | replace('\n', ' ') |
           truncate(([state_attr(diagnostics_text, 'max') | int(100), 255] | min)
                    if diagnostics_text != '' else 255, true, '...') }}
  - if:
      - condition: template
        value_template: >-
          {{ diagnostics_enabled and diagnostics_text != ''
             and states(diagnostics_text) not in ['unknown', 'unavailable']
             and states(diagnostics_text) != diagnostic_value | trim }}
    then:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ diagnostics_text }}"
        data:
          value: "{{ diagnostic_value | trim }}"
  - if:
      - condition: template
        value_template: >-
          {{ diagnostics_enabled and diagnostics_log
             and trigger.id in ['tracker_away', 'activity_away', 'exit_first', 'custom_away']
             and (not (sleep_clear | bool) or not (known_trackers_safe | bool)
                  or not (activity_clear | bool) or not (blockers_clear | bool)
                  or not (absence_evidence_ok | bool)
                  or (guest_mode != '' and not is_state(guest_mode, 'off'))) }}
    then:
      - action: system_log.write
        continue_on_error: true
        data:
          level: info
          message: "Area Occupancy Manager: {{ diagnostic_line | trim }} (trigger: {{ trigger.id }})"

  - choose:
      - alias: "Process all independent restart-resilient timed actions"
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'temporary_tick' }}"
        sequence:
          - parallel:
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ temporary_enabled and temporary_helpers_unique | bool
                         and temporary_deadline != '' and temporary_pending != ''
                         and is_state(temporary_pending, 'on')
                         and as_timestamp(states(temporary_deadline), 0) > 0
                         and as_timestamp(states(temporary_deadline), 0) <= as_timestamp(now()) }}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ temporary_pending }}"
                  - if:
                      - condition: and
                        conditions: !input temporary_end_conditions
                    then: !input temporary_end_actions
                    else:
                      - if:
                          - condition: template
                            value_template: "{{ diagnostics_enabled and diagnostics_log }}"
                        then:
                          - action: system_log.write
                            continue_on_error: true
                            data:
                              level: warning
                              message: "Area Occupancy Manager: timed action 1 skipped because safety conditions failed."
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ temporary_2_enabled and temporary_helpers_unique | bool
                         and temporary_2_deadline != '' and temporary_2_pending != ''
                         and is_state(temporary_2_pending, 'on')
                         and as_timestamp(states(temporary_2_deadline), 0) > 0
                         and as_timestamp(states(temporary_2_deadline), 0) <= as_timestamp(now()) }}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ temporary_2_pending }}"
                  - if:
                      - condition: and
                        conditions: !input temporary_2_end_conditions
                    then: !input temporary_2_end_actions
                    else:
                      - if:
                          - condition: template
                            value_template: "{{ diagnostics_enabled and diagnostics_log }}"
                        then:
                          - action: system_log.write
                            continue_on_error: true
                            data:
                              level: warning
                              message: "Area Occupancy Manager: timed action 2 skipped because safety conditions failed."
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ temporary_3_enabled and temporary_helpers_unique | bool
                         and temporary_3_deadline != '' and temporary_3_pending != ''
                         and is_state(temporary_3_pending, 'on')
                         and as_timestamp(states(temporary_3_deadline), 0) > 0
                         and as_timestamp(states(temporary_3_deadline), 0) <= as_timestamp(now()) }}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ temporary_3_pending }}"
                  - if:
                      - condition: and
                        conditions: !input temporary_3_end_conditions
                    then: !input temporary_3_end_actions
                    else:
                      - if:
                          - condition: template
                            value_template: "{{ diagnostics_enabled and diagnostics_log }}"
                        then:
                          - action: system_log.write
                            continue_on_error: true
                            data:
                              level: warning
                              message: "Area Occupancy Manager: timed action 3 skipped because safety conditions failed."

      - alias: "Occupancy changed to vacant"
        conditions:
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ occupancy_helper != '' and trigger.id == 'became_away' }}"
              - condition: and
                conditions:
                  - condition: template
                    value_template: >-
                      {{ occupancy_helper == '' and trigger.id == 'tracker_away'
                         and tracked_entities | count > 0
                         and known_trackers_safe | bool
                         and activity_clear | bool
                         and blockers_clear | bool
                         and sleep_clear | bool
                         and absence_evidence_ok | bool
                         and (guest_mode == '' or is_state(guest_mode, 'off')) }}
                  - condition: and
                    conditions: !input away_conditions
        sequence: !input away_actions

      - alias: "Occupancy changed to occupied"
        conditions:
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ occupancy_helper != '' and trigger.id == 'became_home' }}"
              - condition: and
                conditions:
                  - condition: template
                    value_template: >-
                      {{ occupancy_helper == '' and trigger.id == 'tracker_home'
                         and tracked_entities | count > 0 }}
                  - condition: and
                    conditions: !input home_conditions
        sequence:
          - variables:
              arrival_started_at: "{{ as_timestamp(now()) }}"
          - parallel:
              - sequence: !input home_actions
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ temporary_enabled and temporary_helpers_unique | bool and (
                            (temporary_deadline == '' and temporary_pending == '')
                            or (temporary_deadline != '' and temporary_pending != '')) }}
                  - condition: and
                    conditions: !input temporary_start_conditions
                  - choose:
                      - alias: "Restart-resilient timer"
                        conditions:
                          - condition: template
                            value_template: "{{ temporary_deadline != '' and temporary_pending != '' }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ temporary_deadline }}"
                            data:
                              timestamp: "{{ (as_timestamp(now()) + (temporary_minutes | int * 60)) | int }}"
                          - action: input_boolean.turn_on
                            target:
                              entity_id: "{{ temporary_pending }}"
                          - if:
                              - condition: template
                                value_template: "{{ temporary_enabled }}"
                            then: !input temporary_start_actions
                    default:
                      - if:
                          - condition: template
                            value_template: "{{ temporary_enabled }}"
                        then: !input temporary_start_actions
                      - delay:
                          minutes: !input temporary_minutes
                      - condition: template
                        value_template: >-
                          {{ (occupancy_helper != '' and
                               (is_state(occupancy_helper, 'off') or
                                (states[occupancy_helper] is not none and
                                 as_timestamp(states[occupancy_helper].last_changed, 0)
                                   <= (arrival_started_at | float))))
                             or (occupancy_helper == '' and
                                 (tracked_entities | count > 0) and
                                 (expand(tracked_entities) | selectattr('state', 'eq', 'home') | list | count > 0)
                                 and ((expand(tracked_entities)
                                    | map(attribute='last_changed')
                                    | map('as_timestamp')
                                    | select('gt', arrival_started_at | float)
                                    | list | count) == 0)) }}
                      - if:
                          - condition: and
                            conditions: !input temporary_end_conditions
                        then: !input temporary_end_actions
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ temporary_2_enabled and temporary_helpers_unique | bool and (
                            (temporary_2_deadline == '' and temporary_2_pending == '')
                            or (temporary_2_deadline != '' and temporary_2_pending != '')) }}
                  - condition: and
                    conditions: !input temporary_2_start_conditions
                  - choose:
                      - alias: "Restart-resilient timer"
                        conditions:
                          - condition: template
                            value_template: "{{ temporary_2_deadline != '' and temporary_2_pending != '' }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ temporary_2_deadline }}"
                            data:
                              timestamp: "{{ (as_timestamp(now()) + (temporary_2_minutes | int * 60)) | int }}"
                          - action: input_boolean.turn_on
                            target:
                              entity_id: "{{ temporary_2_pending }}"
                          - if:
                              - condition: template
                                value_template: "{{ temporary_2_enabled }}"
                            then: !input temporary_2_start_actions
                    default:
                      - if:
                          - condition: template
                            value_template: "{{ temporary_2_enabled }}"
                        then: !input temporary_2_start_actions
                      - delay:
                          minutes: !input temporary_2_minutes
                      - condition: template
                        value_template: >-
                          {{ (occupancy_helper != '' and
                               (is_state(occupancy_helper, 'off') or
                                (states[occupancy_helper] is not none and
                                 as_timestamp(states[occupancy_helper].last_changed, 0)
                                   <= (arrival_started_at | float))))
                             or (occupancy_helper == '' and
                                 (tracked_entities | count > 0) and
                                 (expand(tracked_entities) | selectattr('state', 'eq', 'home') | list | count > 0)
                                 and ((expand(tracked_entities)
                                    | map(attribute='last_changed')
                                    | map('as_timestamp')
                                    | select('gt', arrival_started_at | float)
                                    | list | count) == 0)) }}
                      - if:
                          - condition: and
                            conditions: !input temporary_2_end_conditions
                        then: !input temporary_2_end_actions
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ temporary_3_enabled and temporary_helpers_unique | bool and (
                            (temporary_3_deadline == '' and temporary_3_pending == '')
                            or (temporary_3_deadline != '' and temporary_3_pending != '')) }}
                  - condition: and
                    conditions: !input temporary_3_start_conditions
                  - choose:
                      - alias: "Restart-resilient timer"
                        conditions:
                          - condition: template
                            value_template: "{{ temporary_3_deadline != '' and temporary_3_pending != '' }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ temporary_3_deadline }}"
                            data:
                              timestamp: "{{ (as_timestamp(now()) + (temporary_3_minutes | int * 60)) | int }}"
                          - action: input_boolean.turn_on
                            target:
                              entity_id: "{{ temporary_3_pending }}"
                          - if:
                              - condition: template
                                value_template: "{{ temporary_3_enabled }}"
                            then: !input temporary_3_start_actions
                    default:
                      - if:
                          - condition: template
                            value_template: "{{ temporary_3_enabled }}"
                        then: !input temporary_3_start_actions
                      - delay:
                          minutes: !input temporary_3_minutes
                      - condition: template
                        value_template: >-
                          {{ (occupancy_helper != '' and
                               (is_state(occupancy_helper, 'off') or
                                (states[occupancy_helper] is not none and
                                 as_timestamp(states[occupancy_helper].last_changed, 0)
                                   <= (arrival_started_at | float))))
                             or (occupancy_helper == '' and
                                 (tracked_entities | count > 0) and
                                 (expand(tracked_entities) | selectattr('state', 'eq', 'home') | list | count > 0)
                                 and ((expand(tracked_entities)
                                    | map(attribute='last_changed')
                                    | map('as_timestamp')
                                    | select('gt', arrival_started_at | float)
                                    | list | count) == 0)) }}
                      - if:
                          - condition: and
                            conditions: !input temporary_3_end_conditions
                        then: !input temporary_3_end_actions

      - alias: "Automatic arrival"
        conditions:
          - condition: template
            value_template: "{{ occupancy_helper != '' }}"
          - condition: template
            value_template: >-
              {{ trigger.id in ['tracker_home', 'activity_home', 'lock_home', 'entry_first', 'custom_home', 'sleep_home', 'guest_home', 'blocker_home']
                 or (trigger.id == 'reconcile' and anyone_home_now | bool) }}
          - condition: template
            value_template: "{{ is_state(occupancy_helper, 'off') }}"
          - condition: or
            conditions:
              - condition: template
                value_template: >-
                  {{ (sleep_mode != '' and is_state(sleep_mode, 'on'))
                     or (guest_mode != '' and is_state(guest_mode, 'on')) }}
              - condition: and
                conditions: !input home_conditions
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ occupancy_helper }}"

      - alias: "Automatic vacancy with safety checks"
        conditions:
          - condition: template
            value_template: "{{ occupancy_helper != '' }}"
          - condition: template
            value_template: >-
              {{ trigger.id in ['tracker_away', 'activity_away', 'exit_first', 'custom_away']
                 or (trigger.id == 'reconcile'
                    and (all_trackers_away_stable | bool or all_activity_quiet_stable | bool)) }}
          - condition: template
            value_template: "{{ is_state(occupancy_helper, 'on') }}"
          - condition: template
            value_template: "{{ guest_mode == '' or is_state(guest_mode, 'off') }}"
          - condition: template
            value_template: "{{ sleep_clear | bool }}"
          - condition: template
            value_template: "{{ blockers_clear | bool }}"
          - condition: template
            value_template: "{{ known_trackers_safe | bool }}"
          - condition: template
            value_template: "{{ activity_clear | bool }}"
          - condition: template
            value_template: "{{ absence_evidence_ok | bool }}"
          - condition: and
            conditions: !input away_conditions
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ occupancy_helper }}"
