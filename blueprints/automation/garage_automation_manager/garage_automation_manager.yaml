blueprint:
  name: "🚗 Garage Automation Manager | Calendar, Arrival & Safe Closing"
  author: "3115a083"
  domain: automation
  homeassistant:
    min_version: "2026.11.0"
  source_url: https://github.com/3115a083/ha-blueprints/blob/main/blueprints/automation/garage_automation_manager/garage_automation_manager.yaml
  description: >-
    Open one garage door from matching calendar events with an adjustable
    advance offset, a weekly Schedule helper, a deliberate custom
    request, or a proximity sensor that crosses the arrival threshold
    while a selected Android Auto/Bluetooth connection sensor is ON.
    Each opening route can be disabled. Shared opening conditions can
    be combined freely using Home Assistant's visual AND/OR editor.

    Optionally close automatically after a configurable time, after
    a selected door opens, or after an explicit request. The closing
    timer uses a dedicated date-and-time input_datetime helper so
    its deadline and notification extensions survive automation reloads.
    A configurable Companion app warning supports Extend, Close now
    and Cancel buttons. Automatic closing does NOT require approval.
    A Home Assistant obstruction sensor is OPTIONAL: when none is
    selected, the garage can still close based on the cover state and
    closing conditions, relying on the garage opener's independent
    built-in obstruction detection and automatic reversal.
    If a sensor is selected, an obstructed, unknown or unavailable
    state always blocks the closing command.

    This blueprint only issues cover.open_cover/cover.close_cover.
    It cannot replace a physical garage-door entrapment detector,
    motor auto-reverse mechanism, or certified safety hardware.
    Test hardware safety separately before enabling automatic closing.
  input:
    door_section:
      name: "🚪 01 | Garage door"
      icon: mdi:garage
      input:
        garage_cover:
          name: "Garage cover entity"
          description: >-
            Select a cover with reliable closed/open/opening/closing
            feedback and native cover.open_cover / cover.close_cover
            commands. Do not use an unverified toggle relay.
          selector:
            entity:
              filter:
                - domain: cover
        open_conditions:
          name: "Optional shared opening permission conditions"
          description: >-
            Use any Home Assistant conditions. Top-level entries use
            AND; add OR groups for alternatives. Applies to all
            automatic opening routes. Empty means no extra restriction.
          default: []
          selector:
            condition: {}
        close_conditions:
          name: "Optional shared closing permission conditions"
          description: >-
            These are checked IMMEDIATELY BEFORE every close command,
            including the mobile Close now action. Empty means no
            additional restrictions. A clearance sensor is optional;
            if selected, it must confirm CLEAR before every close.
          default: []
          selector:
            condition: {}
    calendar_section:
      name: "📅 02 | Calendar-based opening"
      icon: mdi:calendar-clock
      collapsed: true
      input:
        calendar_enabled:
          name: "Enable opening before matching calendar events"
          default: false
          selector:
            boolean: {}
        calendar_entity:
          name: "Calendar to watch"
          default: calendar.garage_placeholder
          selector:
            entity:
              filter:
                - domain: calendar
        calendar_offset:
          name: "Calendar event start offset (choose Before)"
          description: >-
            Default: 15 minutes BEFORE the event. Use the
            offset-style duration selector to pick any other
            advance time. Positive After offsets are supported
            by Home Assistant but are not typical for this use.
          default:
            minutes: -15
          selector:
            duration:
              mode: offset
              enable_day: false
              enable_second: false
        calendar_summary_filter:
          name: "Event title contains (case-insensitive)"
          description: >-
            Default: Garage. Only matching event titles open
            the garage. Leave empty to match every event.
            Does not search descriptions.
          default: "Garage"
          selector:
            text: {}
        calendar_allow_all_day:
          name: "Allow all-day events to open the garage"
          description: >-
            Disabled by default to avoid opening the garage at
            midnight for an all-day calendar entry.
          default: false
          selector:
            boolean: {}
        calendar_home_person:
          name: "Optional person who must be HOME for calendar opening"
          description: >-
            Example: choose your person so a matching calendar entry
            opens the garage only when that person is home. Leave
            empty to skip this restriction. Does not affect other
            opening routes.
          default: ""
          selector:
            entity:
              filter:
                - domain: person
        calendar_open_conditions:
          name: "Extra permission conditions ONLY for calendar events"
          description: >-
            Combine any visual HA conditions, such as presence,
            home occupancy, time, sun and AND/OR groups.
            The title, optional person, these conditions and
            shared opening permissions must ALL pass.
          default: []
          selector:
            condition: {}
    schedule_section:
      name: "🗓️ 03 | Weekly schedule opening"
      icon: mdi:calendar-week
      collapsed: true
      input:
        schedule_enabled:
          name: "Enable weekly schedule opening"
          default: false
          selector:
            boolean: {}
        schedule_entity:
          name: "Schedule helper with selected times and weekdays"
          description: >-
            Create a Schedule helper in Settings > Devices & Services
            > Helpers. The garage opens when a scheduled block
            STARTS (the helper changes to ON).
          default: schedule.garage_placeholder
          selector:
            entity:
              filter:
                - domain: schedule
    custom_open_section:
      name: "🎛️ 04 | Custom opening request"
      icon: mdi:gesture-tap
      collapsed: true
      input:
        custom_open_enabled:
          name: "Enable custom opening request"
          default: false
          selector:
            boolean: {}
        custom_open_requests:
          name: "Request entities (OFF to ON)"
          description: >-
            Select one or more input_boolean or binary_sensor
            entities. Switching a selected entity ON is an
            opening request. Add restrictions above under
            Shared opening permission conditions.
          default:
            - input_boolean.garage_open_request_placeholder
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
    vehicle_section:
      name: "🚗 05 | Approaching home by car"
      icon: mdi:car-connected
      collapsed: true
      input:
        vehicle_enabled:
          name: "Enable approach-based opening"
          default: false
          selector:
            boolean: {}
        vehicle_proximity_direction:
          name: "Proximity direction sensor for Home"
          description: >-
            Choose the direction-of-travel sensor for the DRIVER
            from the native Proximity integration. It reports
            towards while approaching, and arrived on arrival.
            Do not use the Nearest Direction sensor when it can
            represent other people.
          default: sensor.garage_proximity_direction_placeholder
          selector:
            entity:
              filter:
                - domain: sensor
        vehicle_proximity_distance:
          name: "Matching Proximity distance sensor for Home"
          description: >-
            Choose the distance sensor for the SAME DRIVER and
            Home zone as the direction sensor above. Proximity
            reports the distance from the EDGE of the zone,
            and zero when arrived. It uses km or miles according
            to Home Assistant's unit system.
          default: sensor.garage_proximity_distance_placeholder
          selector:
            entity:
              filter:
                - domain: sensor
        vehicle_gps_tracker:
          name: "Driver phone GPS tracker for accuracy"
          description: >-
            Choose the same driver's GPS device_tracker, usually
            from the Companion app. GPS accuracy and optional
            extra center-distance checks are taken from its
            attributes. Missing/stale or imprecise GPS blocks
            opening. Do not use a combined Wi-Fi/GPS person
            entity for this accuracy check.
          default: device_tracker.garage_arrival_gps_placeholder
          selector:
            entity:
              filter:
                - domain: device_tracker
        vehicle_connection_sensors:
          name: "Optional Android Auto connection binary sensors"
          description: >-
            Select one or more binary sensors that are ON while
            connected to the car. ANY one authorizes the
            Proximity approach. Alternatively use the Bluetooth
            Connection sensor and car device identity below.
            When using only Bluetooth, leave the harmless
            placeholder selected so the optional trigger
            has a valid entity to watch.
          default:
            - binary_sensor.garage_car_connection_placeholder
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        vehicle_bluetooth_sensor:
          name: "Optional phone Bluetooth Connection sensor"
          description: >-
            Choose the Companion app SENSOR that counts connected
            Bluetooth devices (not the Bluetooth on/off binary
            sensor). It reports device lists in attributes.
          default: sensor.garage_bluetooth_placeholder
          selector:
            entity:
              filter:
                - domain: sensor
        vehicle_bluetooth_list_attribute:
          name: "Connected Bluetooth device list"
          description: >-
            Normally connected_paired_devices. Never use
            paired_devices: it includes disconnected car devices.
          default: connected_paired_devices
          selector:
            select:
              options:
                - label: "Connected paired devices"
                  value: connected_paired_devices
                - label: "Connected non-paired devices"
                  value: connected_not_paired_devices
        vehicle_bluetooth_device:
          name: "Car Bluetooth identity (exact name, MAC or list entry)"
          description: >-
            Copy a connected car entry from Developer Tools >
            States > selected Bluetooth sensor. Enter its
            exact device name, MAC address, or full displayed
            entry e.g. AA:BB:CC:DD:EE:FF (Car Name).
            The comparison ignores case but NOT partial names.
            A dynamic dropdown of device VALUES is not
            available in the native Blueprint selector.
            Leave blank to use only the Android Auto sensor.
          default: ""
          selector:
            text: {}
        vehicle_session_helper:
          name: "Trip session storage (required for car arrival)"
          description: >-
            Create a dedicated Text helper under Settings > Devices
            & Services > Helpers > Text. Leave its initial value
            empty, and ensure it can hold at least 100 characters.
            The automation tracks a sustained car connection
            while Proximity reports towards, the initial
            Proximity distance from Home, and the trip start time.
            It checks those records when Proximity reports arrived.
            One helper per garage. Missing helper blocks opening.
          default: input_text.garage_arrival_trip_placeholder
          selector:
            entity:
              filter:
                - domain: input_text
        vehicle_min_approach_meters:
          name: "Minimum measured approach towards home (meters)"
          description: >-
            The Proximity distance from the EDGE of the Home
            zone must decrease by at least this amount during
            an observed towards trip with car Bluetooth connected.
            Default 300m. This is net approach, not wheel mileage.
          default: 300
          selector:
            number:
              min: 50
              max: 5000
              step: 10
              mode: box
              unit_of_measurement: m
        vehicle_min_connection_minutes:
          name: "Car connected for at least this long (minutes)"
          description: >-
            Counts from the first Proximity towards observation
            with the car connection active, away from Home.
            A reported Bluetooth or Android Auto disconnection
            invalidates the trip. Default 2 minutes.
          default: 2
          selector:
            number:
              min: 1
              max: 30
              step: 1
              mode: box
              unit_of_measurement: min
        vehicle_nearby_meters:
          name: "Optional extra distance limit (0 = Home zone only)"
          description: >-
            With 0, opening occurs when Proximity reports
            arrived and both trip requirements pass. The zone
            may have a large radius; enter 25m to require
            that the phone ALSO be that close to the center
            of Home when the arrived event is received. This
            can prevent opening if GPS hasn't updated in time.
          default: 0
          selector:
            number:
              min: 0
              max: 150
              step: 1
              mode: box
              unit_of_measurement: m
        vehicle_max_gps_accuracy_meters:
          name: "Maximum permitted phone GPS uncertainty (meters)"
          description: >-
            Adjustable maximum GPS uncertainty at Home arrival.
            Default 25m, selectable 5 to 250. The selected
            tracker must supply gps_accuracy and have updated
            within the last five minutes. Smaller values can
            reject valid arrivals on devices with poor GPS.
          default: 25
          selector:
            number:
              min: 5
              max: 250
              step: 1
              mode: box
              unit_of_measurement: m
        vehicle_max_trip_minutes:
          name: "Maximum age of an approach trip (minutes)"
          description: >-
            Ignore old connection/trip records after this period
            to avoid opening on an unrelated later home arrival.
            Default 90 minutes. A new observation away from
            home can start a new trip.
          default: 90
          selector:
            number:
              min: 5
              max: 240
              step: 5
              mode: box
              unit_of_measurement: min
        vehicle_ha_distance_unit:
          name: "Home Assistant distance units for GPS calculations"
          description: >-
            Home Assistant's distance() returns km for metric
            setups and miles for US setups. Choose the matching
            unit so the close range is correctly converted to
            meters. Wrong units may open too early.
          default: km
          selector:
            select:
              options:
                - label: "Kilometers (metric)"
                  value: km
                - label: "Miles (US customary)"
                  value: mi
    closing_section:
      name: "🔒 06 | Automatic closing"
      icon: mdi:shield-check
      description: >-
        Every closing route requires the cover to report OPEN and
        the shared closing conditions to pass. A Home Assistant
        obstruction sensor is optional, and leaving it empty does
        not disable automatic closing. When selected it must
        report CLEAR. The garage motor must have independently
        working obstruction detection and automatic reversal.
      input:
        automatic_closing_enabled:
          name: "Enable time-based automatic closing"
          default: false
          selector:
            boolean: {}
        close_after_minutes:
          name: "Close after this many minutes OPEN"
          description: >-
            The timer starts when the cover changes to OPEN,
            not when an open command is issued.
          default: 20
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              mode: box
              unit_of_measurement: min
        close_deadline_helper:
          name: "Date AND time helper (required for timed closing)"
          description: >-
            Create a dedicated input_datetime helper with both
            Date and Time enabled. Its stored deadline survives
            automation reloads and can be extended by mobile.
            A missing helper disables timed closing.
          default: input_datetime.garage_close_deadline_placeholder
          selector:
            entity:
              filter:
                - domain: input_datetime
        safety_clear_sensor:
          name: "Optional obstruction / clearance binary sensor"
          description: >-
            Leave empty if the garage opener uses its own built-in
            obstruction detection and automatic reversal. In this
            case no Home Assistant clearance sensor is required.
            If you select a sensor, it must report the configured
            CLEAR state. Blocked, unknown or unavailable always
            prevents closing. Never disable physical motor safety.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        safety_clear_state:
          name: "Sensor state that means clear / safe (if selected)"
          default: "off"
          selector:
            select:
              options:
                - label: "OFF means clear"
                  value: "off"
                - label: "ON means clear (inverted contact)"
                  value: "on"
        door_open_close_enabled:
          name: "Close when the selected house door opens"
          default: false
          selector:
            boolean: {}
        house_door_sensor:
          name: "House door contact sensor"
          description: "When this contact becomes ON (open), request garage closing."
          default: binary_sensor.garage_house_door_placeholder
          selector:
            entity:
              filter:
                - domain: binary_sensor
        custom_close_enabled:
          name: "Enable custom closing request"
          default: false
          selector:
            boolean: {}
        custom_close_requests:
          name: "Request closing when these entities become ON"
          description: >-
            Select binary sensors or input_boolean entities.
            Shared closing conditions always apply. If a
            clearance sensor is selected, it must report CLEAR.
          default:
            - input_boolean.garage_close_request_placeholder
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
    notification_section:
      name: "🔔 07 | Timed close warning & extensions"
      icon: mdi:bell-alert-outline
      collapsed: true
      input:
        notify_before_minutes:
          name: "Warn this many minutes before timed close (0 = none)"
          description: >-
            Runs once when the deadline enters the warning
            window. Intended for a mobile Companion notify
            action that supports buttons.
          default: 5
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: box
              unit_of_measurement: min
        notify_entities:
          name: "Notification recipients (select one or more)"
          description: >-
            Choose notify entities using the native picker.
            These receive a text warning. Action buttons
            require the Companion mobile service below,
            because generic notify entities do not guarantee
            actionable-push data. Avoid sending to the same
            phone twice unless duplicates are wanted.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: notify
        mobile_notify_action:
          name: "Companion service for actionable buttons (optional)"
          description: >-
            Example notify.mobile_app_phone. Enables Extend,
            Close now and Cancel buttons. Notify entities above
            only receive plain text. Leave empty if buttons
            are not needed. Closing still works without it.
          default: ""
          selector:
            text: {}
        extension_minutes:
          name: "Minutes added by an Extend button"
          default: 10
          selector:
            number:
              min: 1
              max: 240
              step: 1
              mode: box
              unit_of_measurement: min
    advanced_section:
      name: "⚙️ 08 | Additional actions & diagnostics"
      icon: mdi:tune
      collapsed: true
      input:
        on_open_command:
          name: "Optional actions after sending an OPEN command"
          description: >-
            Runs after the command is attempted, not after
            verified physical opening. Does not bypass safety.
          default: []
          selector:
            action: {}
        on_close_command:
          name: "Optional actions after sending a CLOSE command"
          description: >-
            Runs after the command is attempted, not after
            verified physical closing. Does not bypass safety.
          default: []
          selector:
            action: {}
        warn_configuration:
          name: "Warn if timed closing lacks a date-and-time helper"
          default: true
          selector:
            boolean: {}

variables:
  garage: !input garage_cover
  calendar_enabled: !input calendar_enabled
  calendar_filter: !input calendar_summary_filter
  calendar_all_day: !input calendar_allow_all_day
  calendar_home_person: !input calendar_home_person
  schedule_enabled: !input schedule_enabled
  custom_open_enabled: !input custom_open_enabled
  vehicle_enabled: !input vehicle_enabled
  vehicle_gps_tracker: !input vehicle_gps_tracker
  vehicle_proximity_direction: !input vehicle_proximity_direction
  vehicle_proximity_distance: !input vehicle_proximity_distance
  vehicle_connection_sensors: !input vehicle_connection_sensors
  vehicle_bluetooth_sensor: !input vehicle_bluetooth_sensor
  vehicle_bluetooth_list_attribute: !input vehicle_bluetooth_list_attribute
  vehicle_bluetooth_device: !input vehicle_bluetooth_device
  vehicle_nearby_meters: !input vehicle_nearby_meters
  vehicle_max_gps_accuracy_meters: !input vehicle_max_gps_accuracy_meters
  vehicle_session_helper: !input vehicle_session_helper
  vehicle_min_approach_meters: !input vehicle_min_approach_meters
  vehicle_min_connection_minutes: !input vehicle_min_connection_minutes
  vehicle_max_trip_minutes: !input vehicle_max_trip_minutes
  vehicle_ha_distance_unit: !input vehicle_ha_distance_unit
  close_enabled: !input automatic_closing_enabled
  close_after: !input close_after_minutes
  deadline_helper: !input close_deadline_helper
  safety_sensor: !input safety_clear_sensor
  safe_state: !input safety_clear_state
  door_close_enabled: !input door_open_close_enabled
  custom_close_enabled: !input custom_close_enabled
  notification_advance: !input notify_before_minutes
  notify_action: !input mobile_notify_action
  notify_entity_ids: !input notify_entities
  extend_minutes: !input extension_minutes
  warn_configuration: !input warn_configuration
  helper_ready: >-
    {{ deadline_helper != 'input_datetime.garage_close_deadline_placeholder'
       and states(deadline_helper) not in ['unknown', 'unavailable'] }}
  clearance_ready: >-
    {{ safety_sensor in ['', none]
       or (safety_sensor is string
           and safety_sensor.startswith('binary_sensor.')
           and states(safety_sensor) == safe_state) }}
  deadline_ts: >-
    {{ as_timestamp(states(deadline_helper), 0) if
       deadline_helper != 'input_datetime.garage_close_deadline_placeholder'
       else 0 }}
  timestamp_now: "{{ as_timestamp(now()) }}"
  action_extend: "{{ 'GARAGE_EXTEND_' ~ this.entity_id }}"
  action_cancel: "{{ 'GARAGE_CANCEL_' ~ this.entity_id }}"
  action_close_now: "{{ 'GARAGE_CLOSE_NOW_' ~ this.entity_id }}"
  notice_tag: "{{ 'garage_auto_close_' ~ (this.entity_id | replace('.', '_')) }}"

triggers:
  - trigger: calendar
    id: calendar_open
    entity_id: !input calendar_entity
    event: start
    offset: !input calendar_offset
    enabled: !input calendar_enabled
  - trigger: state
    id: schedule_open
    entity_id: !input schedule_entity
    to: "on"
    enabled: !input schedule_enabled
  - trigger: state
    id: custom_open
    entity_id: !input custom_open_requests
    to: "on"
    enabled: !input custom_open_enabled
  - trigger: state
    id: vehicle_approach
    entity_id: !input vehicle_proximity_direction
    enabled: !input vehicle_enabled
  - trigger: state
    id: vehicle_distance_changed
    entity_id: !input vehicle_proximity_distance
    enabled: !input vehicle_enabled
  - trigger: state
    id: vehicle_bluetooth_changed
    entity_id: !input vehicle_bluetooth_sensor
    enabled: !input vehicle_enabled
  - trigger: state
    id: vehicle_android_auto_changed
    entity_id: !input vehicle_connection_sensors
    enabled: !input vehicle_enabled
  - trigger: state
    id: garage_opened
    entity_id: !input garage_cover
    to: "open"
  - trigger: state
    id: house_door_opened
    entity_id: !input house_door_sensor
    to: "on"
    enabled: !input door_open_close_enabled
  - trigger: state
    id: custom_close
    entity_id: !input custom_close_requests
    to: "on"
    enabled: !input custom_close_enabled
  - trigger: state
    id: deadline_changed
    entity_id: !input close_deadline_helper
    enabled: !input automatic_closing_enabled
  - trigger: time_pattern
    id: minute_check
    minutes: "/1"
  - trigger: event
    id: mobile_action
    event_type: mobile_app_notification_action
  - trigger: homeassistant
    id: startup
    event: start

conditions: []

actions:
  - variables:
      is_mobile_extend: >-
        {{ trigger.id == 'mobile_action'
           and trigger.event.data.get('action') == action_extend }}
      is_mobile_cancel: >-
        {{ trigger.id == 'mobile_action'
           and trigger.event.data.get('action') == action_cancel }}
      is_mobile_close: >-
        {{ trigger.id == 'mobile_action'
           and trigger.event.data.get('action') == action_close_now }}
      calendar_match: >-
        {{ calendar_enabled and trigger.id == 'calendar_open'
           and (calendar_all_day
                or not trigger.calendar_event.all_day | default(false))
           and (calendar_filter | lower in
                (trigger.calendar_event.summary | default('', true) | lower)) }}
      trip_helper_ready: >-
        {{ vehicle_session_helper is string
           and vehicle_session_helper.startswith('input_text.')
           and vehicle_session_helper != 'input_text.garage_arrival_trip_placeholder'
           and states(vehicle_session_helper) not in ['unknown', 'unavailable'] }}
      car_connected: >-
        {% set match = namespace(ok=false) %}
        {% for ent in expand(vehicle_connection_sensors) if ent.state == 'on' %}
          {% set match.ok = true %}
        {% endfor %}
        {% set wanted = vehicle_bluetooth_device | trim | lower %}
        {% if wanted and vehicle_bluetooth_sensor is string
              and vehicle_bluetooth_sensor.startswith('sensor.')
              and vehicle_bluetooth_sensor != 'sensor.garage_bluetooth_placeholder'
              and states(vehicle_bluetooth_sensor) not in ['unknown', 'unavailable'] %}
          {% set devices = state_attr(vehicle_bluetooth_sensor,
                                     vehicle_bluetooth_list_attribute) %}
          {% if devices is sequence and devices is not string %}
            {% for raw in devices %}
              {% set entry = raw | string | trim | lower %}
              {% if entry == wanted
                    or entry.startswith(wanted ~ ' (')
                    or entry.endswith(' (' ~ wanted ~ ')') %}
                {% set match.ok = true %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {{ match.ok }}
      proximity_distance_meters: >-
        {% if vehicle_proximity_distance !=
              'sensor.garage_proximity_distance_placeholder'
              and is_number(states(vehicle_proximity_distance)) %}
          {% set factor = 1609.344 if vehicle_ha_distance_unit == 'mi' else 1000 %}
          {{ (states(vehicle_proximity_distance) | float(0) * factor) | round(1) }}
        {% else %}
          -1
        {% endif %}
      gps_ready: >-
        {% set tracker = states[vehicle_gps_tracker] %}
        {{ vehicle_gps_tracker != 'device_tracker.garage_arrival_gps_placeholder'
           and tracker is not none
           and tracker.state not in ['unknown', 'unavailable']
           and is_number(tracker.attributes.get('latitude'))
           and is_number(tracker.attributes.get('longitude'))
           and is_number(tracker.attributes.get('gps_accuracy'))
           and tracker.attributes.get('latitude') | float(999) >= -90
           and tracker.attributes.get('latitude') | float(999) <= 90
           and tracker.attributes.get('longitude') | float(999) >= -180
           and tracker.attributes.get('longitude') | float(999) <= 180
           and tracker.attributes.get('gps_accuracy') | float(999) <=
               vehicle_max_gps_accuracy_meters | float(25)
           and timestamp_now | float(0) -
               as_timestamp(tracker.last_updated, 0) <= 300 }}
      gps_home_distance_meters: >-
        {% set tracker = states[vehicle_gps_tracker] %}
        {% if gps_ready | bool(false) and tracker is not none %}
          {% set latitude = tracker.attributes.get('latitude') | float %}
          {% set longitude = tracker.attributes.get('longitude') | float %}
          {% set dist = distance(latitude, longitude) %}
          {% set factor = 1609.344 if vehicle_ha_distance_unit == 'mi' else 1000 %}
          {{ (dist | float(-1) * factor) | round(1) }}
        {% else %}
          -1
        {% endif %}
      trip_session: >-
        {% if trip_helper_ready | bool(false) %}
          {% set parts = states(vehicle_session_helper).split('|') %}
          {{ dict(s=parts[0] | int(0), d=parts[1] | float(0))
             if parts | count == 2 and is_number(parts[0])
             and is_number(parts[1]) else {} }}
        {% else %}
          {{ {} }}
        {% endif %}
      trip_age_seconds: >-
        {{ timestamp_now | float(0) -
           (trip_session.get('s', 0) | float(0)) }}
      arrival_match: >-
        {{ vehicle_enabled and trigger.id == 'vehicle_approach'
           and trigger.to_state is not none
           and trigger.to_state.state == 'arrived'
           and trip_helper_ready | bool(false)
           and car_connected | bool(false)
           and gps_ready | bool(false)
           and gps_home_distance_meters | float(-1) >= 0
           and proximity_distance_meters | float(-1) >= 0
           and trip_session.get('s', 0) | float(0) > 0
           and trip_age_seconds | float(-1) >=
                vehicle_min_connection_minutes | float(2) * 60
           and trip_age_seconds | float(0) <=
                vehicle_max_trip_minutes | float(90) * 60
           and trip_session.get('d', 0) | float(0) -
                proximity_distance_meters | float(999999) >=
                vehicle_min_approach_meters | float(300)
           and (vehicle_nearby_meters | float(0) == 0
                or gps_home_distance_meters | float(999999) <=
                    vehicle_nearby_meters | float(0)) }}
      open_requested: >-
        {{ (calendar_match | bool(false))
           or (trigger.id == 'schedule_open' and schedule_enabled)
           or (trigger.id == 'custom_open' and custom_open_enabled)
           or (arrival_match | bool(false)) }}
      close_requested: >-
        {{ (trigger.id == 'house_door_opened' and door_close_enabled)
           or (trigger.id == 'custom_close' and custom_close_enabled)
           or (is_mobile_close | bool(false))
           or (trigger.id == 'minute_check' and close_enabled
               and helper_ready | bool(false)
               and deadline_ts | float(0) > 0
               and timestamp_now | float(0) >= deadline_ts | float(0)
               and timestamp_now | float(0) -
                   deadline_ts | float(0) <= 300) }}
  - choose:
      - alias: "Reset observed trip when car disconnects or Proximity turns away"
        conditions:
          - condition: template
            value_template: >-
              {{ vehicle_enabled and trip_helper_ready | bool(false)
                 and (trigger.id == 'startup'
                   or (trigger.id in
                       ['vehicle_approach', 'vehicle_distance_changed',
                        'vehicle_bluetooth_changed', 'vehicle_android_auto_changed']
                       and not (car_connected | bool(false)))
                   or (trigger.id == 'vehicle_approach'
                       and trigger.to_state is not none
                       and trigger.to_state.state in ['away_from', 'unknown'])) }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ vehicle_session_helper }}"
            data:
              value: ""
      - alias: "Start observing a car trip while Proximity says towards"
        conditions:
          - condition: template
            value_template: >-
              {{ vehicle_enabled
                 and trigger.id in ['vehicle_approach', 'vehicle_distance_changed']
                 and trip_helper_ready | bool(false)
                 and car_connected | bool(false)
                 and is_state(vehicle_proximity_direction, 'towards')
                 and proximity_distance_meters | float(-1) >=
                     vehicle_min_approach_meters | float(300)
                 and (trip_session.get('s', 0) | float(0) == 0
                      or trip_age_seconds | float(0) >
                         vehicle_max_trip_minutes | float(90) * 60) }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ vehicle_session_helper }}"
            data:
              value: >-
                {{ timestamp_now | int(0) }}|{{ proximity_distance_meters | float(0) }}
  - choose:
      - alias: "Extend the stored close deadline from a matching phone action"
        conditions:
          - condition: template
            value_template: >-
              {{ (is_mobile_extend | bool(false)) and close_enabled
                 and helper_ready | bool(false)
                 and is_state(garage, 'open')
                 and deadline_ts | float(0) > 0
                 and deadline_ts | float(0) >
                     timestamp_now | float(0) - 300 }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ deadline_helper }}"
            data:
              timestamp: >-
                {{ ([deadline_ts | float(0),
                     timestamp_now | float(0)] | max) +
                   (extend_minutes | int(10)) * 60 }}
      - alias: "Cancel this opening cycle's automatic close via phone"
        conditions:
          - condition: template
            value_template: >-
              {{ (is_mobile_cancel | bool(false)) and close_enabled
                 and helper_ready | bool(false)
                 and is_state(garage, 'open') }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ deadline_helper }}"
            data:
              timestamp: "{{ timestamp_now | float(0) - 86400 }}"
      - alias: "Start a fresh close deadline on real garage OPEN transition"
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'garage_opened'
                 and close_enabled
                 and helper_ready | bool(false)
                 and trigger.from_state is not none
                 and trigger.from_state.state != 'open' }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ deadline_helper }}"
            data:
              timestamp: >-
                {{ timestamp_now | float(0) +
                   (close_after | int(20)) * 60 }}
  - if:
      - condition: template
        value_template: >-
          {{ trigger.id in ['minute_check', 'deadline_changed']
             and close_enabled
             and helper_ready | bool(false)
             and is_state(garage, 'open')
             and deadline_ts | float(0) > 0
             and notification_advance | int(0) > 0
             and (notify_action | regex_match('^notify\\.mobile_app_[a-z0-9_]+$')
                  or notify_entity_ids | count > 0)
             and timestamp_now | float(0) < deadline_ts | float(0)
             and deadline_ts | float(0) -
                 timestamp_now | float(0) <=
                 (notification_advance | int(0)) * 60
             and (trigger.id == 'deadline_changed'
                  or deadline_ts | float(0) -
                     timestamp_now | float(0) >
                     (notification_advance | int(0) - 1) * 60) }}
    then:
      - variables:
          closing_warning_title: "Garage closes soon"
          closing_warning_message: >-
            The garage is scheduled to close in approximately
            {{ ((deadline_ts | float(0) -
                timestamp_now | float(0)) / 60) | round(0) | int }} minute(s).
            Extend or cancel if needed. Closing remains subject to
            any selected obstruction sensor and all closing conditions.
      - if:
          - condition: template
            value_template: "{{ notify_entity_ids | count > 0 }}"
        then:
          - action: notify.send_message
            target:
              entity_id: "{{ notify_entity_ids }}"
            data:
              title: "{{ closing_warning_title }}"
              message: "{{ closing_warning_message }}"
            continue_on_error: true
      - if:
          - condition: template
            value_template: >-
              {{ notify_action | regex_match('^notify\\.mobile_app_[a-z0-9_]+$') }}
        then:
          - action: "{{ notify_action }}"
            data:
              title: "{{ closing_warning_title }}"
              message: "{{ closing_warning_message }}"
              data:
                tag: "{{ notice_tag }}"
                actions:
                  - action: "{{ action_extend }}"
                    title: "Extend"
                  - action: "{{ action_close_now }}"
                    title: "Close now"
                  - action: "{{ action_cancel }}"
                    title: "Cancel automatic closing"
            continue_on_error: true
  - choose:
      - alias: "Discard a completed arrived event to prevent repeated openings"
        conditions:
          - condition: template
            value_template: >-
              {{ vehicle_enabled and trigger.id == 'vehicle_approach'
                 and trigger.to_state is not none
                 and trigger.to_state.state == 'arrived'
                 and trip_helper_ready | bool(false) }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ vehicle_session_helper }}"
            data:
              value: ""
  - choose:
      - alias: "Open once for a permitted event"
        conditions:
          - condition: template
            value_template: "{{ (open_requested | bool(false)) and is_state(garage, 'closed') }}"
          - condition: and
            conditions: !input open_conditions
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ trigger.id != 'calendar_open' }}"
              - condition: and
                conditions:
                  - condition: template
                    value_template: >-
                      {{ calendar_home_person in ['', none]
                         or is_state(calendar_home_person, 'home') }}
                  - condition: and
                    conditions: !input calendar_open_conditions
        sequence:
          - action: cover.open_cover
            target:
              entity_id: "{{ garage }}"
            continue_on_error: true
          - choose: []
            default: !input on_open_command
      - alias: "Close with current cover status and optional clearance sensor"
        conditions:
          - condition: template
            value_template: >-
              {{ (close_requested | bool(false)) and is_state(garage, 'open')
                 and clearance_ready | bool(false) }}
          - condition: and
            conditions: !input close_conditions
        sequence:
          - action: cover.close_cover
            target:
              entity_id: "{{ garage }}"
            continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ close_enabled and helper_ready | bool(false) }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ deadline_helper }}"
                data:
                  timestamp: "{{ timestamp_now | float(0) - 86400 }}"
          - choose: []
            default: !input on_close_command
      - alias: "Warn when the timed close helper is missing"
        conditions:
          - condition: template
            value_template: >-
              {{ warn_configuration and trigger.id in
                   ['startup', 'garage_opened'] and close_enabled
                 and not helper_ready | bool(false) }}
        sequence:
          - action: persistent_notification.create
            data:
              notification_id: "garage_manager_setup_{{ this.entity_id | replace('.', '_') }}"
              title: "Garage automation: timed close helper missing"
              message: >-
                Time-based closing requires a dedicated input_datetime
                helper with both date and time enabled. Without the
                helper, timed closing stays disabled. A Home Assistant
                obstruction sensor is optional; the garage opener
                must provide independent physical obstruction detection
                and automatic reversal.

mode: queued
max: 20
max_exceeded: warning
