name: Validate Blueprints
on:
  push:
  pull_request:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'Jinja2>=3,<4'
      - name: Validate blueprint structure and safety scenarios
        run: python -m unittest discover -s tests -v

  home-assistant-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pinned Home Assistant test dependencies
        run: python -m pip install -r integration_tests/requirements.txt
      - name: Validate and execute the energy-saving blueprint with real HA
        run: python -m pytest integration_tests -q
