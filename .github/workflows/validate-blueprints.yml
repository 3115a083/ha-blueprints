name: Validate Blueprints
on:
  push:
  pull_request:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'Jinja2>=3,<4'
      - name: Validate blueprint structure and safety scenarios
        run: python -m unittest discover -s tests -v

  home-assistant-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pinned Home Assistant test dependencies
        run: python -m pip install -r integration_tests/requirements.txt
      - name: Validate existing blueprints on their supported HA baseline
        run: python -m pytest integration_tests -q -k 'not multi_room_contact_watch'

  contact-watch-ha-2026-11:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install Home Assistant 2026.11.0 and test tools
        run: python -m pip install 'homeassistant==2026.11.0' 'pytest==9.1.1' 'pytest-asyncio==1.4.0'
      - name: Validate and execute Contact Watch with HA 2026.11.0
        run: python -m pytest integration_tests/test_multi_room_contact_watch.py integration_tests/test_catalog.py -q -k multi_room_contact_watch
